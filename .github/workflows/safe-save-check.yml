name: RL-app 测试
on:
  push:
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/safe-save-check.yml"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 必须配置私有数据仓库只读凭据
        env:
          RL_DATA_TOKEN: ${{ secrets.RL_DATA_TOKEN }}
        run: |
          if [ -z "$RL_DATA_TOKEN" ]; then
            echo "::error::缺少 RL_DATA_TOKEN：请配置只对 Vicki257/rl-data 有 Contents: Read 权限的 fine-grained token"
            exit 1
          fi
      - name: 读取真实 RL-data 的同名开发分支
        uses: actions/checkout@v4
        with:
          repository: Vicki257/rl-data
          ref: ${{ github.head_ref || github.ref_name }}
          path: rl-data
          token: ${{ secrets.RL_DATA_TOKEN }}
          persist-credentials: false
      - name: 打印并核对真实数据来源
        env:
          DATA_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test -f rl-data/data/rels.json || { echo "::error::缺少真实 rels.json"; exit 1; }
          echo "RL-data repository: Vicki257/rl-data"
          echo "RL-data branch: $DATA_BRANCH"
          echo "RL-data commit: $(git -C rl-data rev-parse HEAD)"
          mv rl-data ../rl-data
      - name: 安全保存与开发分支测试
        run: node tests/test_safe_save.cjs
      - name: 认知树、关系、UID、引用、环与演化链（强制真实数据）
        run: |
          test -f ../rl-data/data/rels.json
          node tests/test_tree.cjs --require-real-data
      - name: 拖动关系和端点反例
        run: node tests/test_rel_drag.cjs --require-real-data
