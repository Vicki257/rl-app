name: RL-app 安全保存测试
on:
  push:
    paths:
      - "index.html"
      - "tests/test_safe_save.cjs"
      - ".github/workflows/safe-save-check.yml"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测试陈旧写入与 UID 保留
        run: node tests/test_safe_save.cjs
