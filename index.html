<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天">
<meta name="theme-color" content="#0D0D0C">
<title>强化学习系统</title>
<!-- build 2026-09-23i -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0D0D0C; --paper:#1A1A17; --ink:#F3EFE6; --ink2:#D9D4C8; --ink3:#9D9589;
  --line:#302F29; --soft:#232219; --accent:#E5C463; --accentSoft:#3B3218; --bad:#E88E74; --badSoft:#3A2318; --onAccent:#12110F;
  --glow:#2A2416; --navbg:rgba(13,13,12,.96); --qink:#FFF6E6; --phink:#5B554A; --dot:#312C25;
  --fnline:#4A4636; --inth:#211F1C; --fx:#8FB489; --kdp:#8FB3D9; --edge:#8A7B58; --pin:#514A3F;
  --wn:#D9A566; --wnbg:rgba(217,165,102,.075); --wnline:rgba(217,165,102,.5);
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --read:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;  /* 正文（人写的和 AI 写的）统一用这个 */ --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* 白天版。只改颜色变量，版式和夜间完全一样 */
html[data-theme="light"]{
  --ground:#F6F4EF; --paper:#FFFFFF; --ink:#1A1916; --ink2:#3A362E; --ink3:#78705F;
  --line:#E3DED1; --soft:#F2EFE7; --accent:#8A6D12; --accentSoft:#F5EBC9; --bad:#A8411F; --badSoft:#FBE7DF; --onAccent:#FFFFFF;
  --glow:#EFE7D2; --navbg:rgba(246,244,239,.96); --qink:#1A1916; --phink:#A9A294; --dot:#E0DACA;
  --fnline:#DDD6C6; --inth:#EDE9DF; --fx:#3C7A33; --kdp:#2B6397; --edge:#A3927066; --pin:#A9A294;
  --wn:#8A5A12; --wnbg:rgba(180,130,30,.10); --wnline:rgba(160,110,20,.45);
}
html[data-theme="light"] .nd.drag{box-shadow:0 8px 20px rgba(0,0,0,.12)}
html[data-theme="light"] .sheet{background:rgba(0,0,0,.28)}

/* 正文统一：凡是「内容」——我写的、AI 写的——都用 --read，界面文字（按钮、标签、导航、元信息）才用 sans。
   这样一页里不会出现三四种字体。公式和手算还是等宽，那是它该用的。 */
.kv .v,.line3 .txt,.sub,.evi,.dtl,.pain p,.recall .w,.how,.judge,.q,.sop .tx,.nd .q,.fn .q,
.tbl td,.cmp td,.banner,.prev,textarea,input,.srch{font-family:var(--read);font-weight:600}
.tbl th,.cmp th{font-family:var(--sans)}
.sop .mono,.meta,.zc .z,.step .n{font-family:var(--mono)}
.nd .t,.fn .t,.sop .sn i{font-family:var(--sans)}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden}
body{overflow-x:hidden}
body{margin:0;background:radial-gradient(130% 42% at 50% 0%,var(--glow) 0%,var(--ground) 62%) fixed,var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;overflow-x:hidden}
.body{flex:1;min-width:0;max-width:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;display:flex;flex-direction:column;gap:12px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--navbg);backdrop-filter:blur(10px);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.nav button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink3);padding:6px 0;cursor:pointer}
.nav button[aria-current="true"]{color:var(--accent);font-weight:700}
button{font:inherit}
button:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.back{font-size:16px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.h1{font-family:var(--serif);font-size:27px;font-weight:900;margin:0}
.h2{font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin:6px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.chev{margin-left:auto;color:var(--ink3);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.meta{font-size:13px;color:var(--ink3);font-family:var(--mono)}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.ok{background:var(--accentSoft);color:var(--accent)} .bd{background:var(--badSoft);color:var(--bad)}
.q{font-family:var(--serif);color:var(--qink);font-size:21px;font-weight:700;line-height:1.45;margin:0;text-wrap:balance}
.lbl{font-size:13.5px;color:var(--accent);font-weight:700;width:38px;flex:none}
.line3{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.65}
.line3:first-child{border-top:0}
.line3 .txt{flex:1;min-width:0}
.btn{font-weight:700;font-size:16.5px;background:var(--accent);color:var(--onAccent);border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15.5px;padding:12px}
.btn:disabled{opacity:.5}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.small{font-size:14px;color:var(--ink2);line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px}
.tbl table{border-collapse:collapse;font-size:14px;min-width:620px;width:100%}
.tbl table.mq,.tbl table.fx,.tbl.in table{table-layout:fixed}
.tbl table.mq td,.tbl table.mq th,.tbl table.fx td,.tbl table.fx th,.tbl.in td,.tbl.in th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl table.mq tr.sub>td,.tbl table.fx tr.sub>td,.tbl.in tr.sub>td{overflow:visible;white-space:normal}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl th{color:var(--ink3);background:var(--soft);white-space:nowrap}
.tbl tr.sel td{background:var(--accentSoft)}
.tbl tbody tr{cursor:pointer}
.kv{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13.5px;color:var(--accent);font-weight:700}
.kv .v{font-size:16px;line-height:1.7;white-space:pre-line}
.step{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:16px;cursor:pointer}
.step .n{font-family:var(--mono);width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11px;flex:none}
.arrow{padding-left:5px;color:var(--accent);opacity:.6;font-size:14px}
.sub{margin:2px 0 6px 30px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.recall{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.recall:first-child{border-top:0}
.recall .t{font-weight:700;font-size:16px}
.recall .w{font-size:15px;color:var(--ink2);line-height:1.6}
.tag{font-size:12.5px;font-weight:700;color:var(--accent)}
.evi{margin-top:8px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.cmp{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.cmp td,.cmp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--ink3);font-size:12.5px}
textarea,input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.6}
textarea{min-height:70px;resize:vertical}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .in{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--onAccent);font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px;z-index:9;max-width:90%;text-align:center}
.ed{border-radius:8px;padding:3px 7px;margin:0 -7px;min-height:1.7em;transition:background .15s}
.ed:hover{background:var(--soft)}
.ed:focus{outline:none;background:var(--soft);box-shadow:0 0 0 1px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:var(--phink)}
.prev{color:var(--ink3);font-size:14.5px;line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pw{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.pw .pin{width:44px}
.fold{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:15.5px}
.fold.sm{font-size:15px;padding:10px 0}
.fold.sm .meta{margin-left:auto}
.mg{border-top:1px solid var(--soft)}
.mg:first-child{border-top:0}
.mg .line3{padding-left:10px;font-size:15px}
.srch{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);margin-bottom:10px;-webkit-appearance:none}
.srch:focus{outline:none;border-color:var(--accent)}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag.m{color:var(--ink);background:var(--accentSoft);border-radius:5px;padding:2px 7px}
.how{margin-top:8px;padding:11px 12px;background:var(--accentSoft);border-radius:10px;font-size:15px;line-height:1.65;color:var(--ink2)}
.how b{display:block;color:var(--accent);font-size:13px;margin-bottom:3px}
.btn.ghost.bd{color:var(--bad);border-color:var(--bad)}
.center{display:grid;place-items:center;min-height:60vh;color:var(--ink3);font-size:16px}
/* SOP 白板 */
.board{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
.board.zoom{overflow:auto}
.cvs{position:relative;width:1100px;height:860px;transform-origin:0 0}
.zc{display:flex;gap:6px;align-items:center;margin-top:8px}
.zc button{font:inherit;font-size:13.5px;background:var(--paper);border:1px solid var(--line);color:var(--ink3);border-radius:999px;padding:4px 12px;cursor:pointer}
.zc .z{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:4px}
.flow{display:none;margin-top:10px}
.fl{display:flex;gap:8px;justify-content:center}
.fn{flex:1;min-width:0;background:var(--soft);border:1px solid var(--fnline);border-radius:11px;padding:13px 12px;cursor:pointer}
.fn.plain{border-style:dashed;background:transparent;cursor:default;text-align:center}
.fn .t{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;gap:4px}
.fn.plain .t{color:var(--ink);justify-content:center}
.fn .q{color:var(--ink2);font-size:12.5px;line-height:1.5;margin-top:3px}
.fa{text-align:center;color:var(--accent);opacity:.65;font-size:15px;line-height:1;padding:8px 0}
.fp{font:inherit;font-size:14px;color:var(--ink3);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.fp b{color:var(--ink);margin-right:6px;font-weight:700}
.fp.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.fp.on b{color:var(--accent)}
.pin{width:40px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--accent);font:13px var(--mono);text-align:center;padding:4px 0}
.pin:focus{outline:none;border-color:var(--accent);background:var(--soft)}
.pin::placeholder{color:var(--pin)}
.tbl td .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.nowrap td{height:44px;vertical-align:middle;padding:0 10px}
@media(max-width:700px){.board,.zc{display:none}.flow{display:block}}
/* 宽屏统一栅格。整个 app 手机优先是一根 560px 窄栏，电脑上等于白看；
   但只把 SOP 那一张卡单独撑开会一大一小，所以宽屏时整根栏子一起变宽，
   所有卡片同宽、左右对齐同一条线。正文另外限宽，免得一行八十个字。 */
/* 主线问题两层表 */
.tbl table.mq{min-width:700px}.tbl.in table{min-width:840px}
tr.bg{cursor:pointer}tr.bg:hover>td{background:var(--accentSoft)}
.tbl td.bt{font-size:15.5px;font-weight:700;color:var(--ink);min-width:260px}
.tbl td.bt .tri{display:inline-block;color:var(--accent);font-size:9px;width:17px;transition:transform .15s}
tr.bg.on td.bt .tri{transform:rotate(90deg)}
.bar{display:inline-flex;gap:3px;vertical-align:middle}
.bar i{width:10px;height:13px;border-radius:2px;background:var(--line);display:block}
.bar i.f{background:var(--accent)}
.tbl .red{color:var(--bad);background:none}
.tbl .meta.kbd{color:var(--bad);background:none;font-weight:700}
.tbl .meta.kok{color:var(--accent);font-weight:700}
.tbl .meta.kdp{color:var(--kdp);font-weight:700}
tr.sub>td{padding:0 0 12px 30px !important;height:auto;background:var(--ground);white-space:normal;overflow:visible}
.judge{font-size:14px;color:var(--ink2);padding:11px 2px 10px;line-height:1.6}
.dtl{font-size:14.5px;line-height:1.75;color:var(--ink);white-space:pre-line;padding:12px 14px;background:var(--soft)}
.tbl.in{background:var(--soft)}.tbl.in th{background:var(--inth)}
.tbl td.pri{text-align:center;position:relative}
.tbl td.pri .td{display:block;font-size:10px;color:var(--accent);line-height:1;margin-top:-3px}
tr.k.hot>td{background:var(--accentSoft)}
.tbl td.cv{color:var(--ink3);text-align:center}
.tbl .cell.dim{color:var(--ink2)}
tr.add>td{color:var(--accent);cursor:pointer;border-bottom:0}
tr.add:hover>td{background:var(--accentSoft)}
@media(min-width:701px){
  #app{max-width:min(1080px,100vw - 48px)}
  .body{padding-left:28px;padding-right:28px;gap:14px}
  .h1{font-size:31px}
  /* 纯文字不跟着拉满：表格、白板、公式块不在此列，它们要多宽有多宽 */
  .kv .v,.sop .tx,.sop .wn,.sop .mono{max-width:820px}
  /* 满宽 1024px 的按钮又长又丑，收窄但仍从同一条左线起 */
  .body>.btn{max-width:420px}
  .sheet .in{max-width:680px}
}
.cvs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nd{position:absolute;width:150px;line-height:1.4;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:grab;user-select:none}
.nd.plain{border-style:dashed;background:transparent}
.nd.drag{cursor:grabbing;border-color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:9}
.nd .t{font-family:var(--mono);font-size:13.5px;color:var(--accent);display:flex;justify-content:space-between;gap:6px;align-items:center}
.nd.plain .t{color:var(--ink)}
.nd .q{color:var(--ink3);font-size:12px;line-height:1.55;margin-top:4px}
/* 痛点 */
.pain{border-left:2px solid var(--accentSoft);padding-left:11px;margin:0 0 13px}
.pain.un{border-left-color:var(--line);opacity:.8}
.pain .pp{font-size:12.5px;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.pain.un .pp{color:var(--ink3)}
.pain .fx{font-size:12.5px;letter-spacing:.06em;color:var(--fx);margin:7px 0 3px}
.pain.un .fx{color:var(--ink3)}
.pain p{margin:0;font-size:16px;line-height:1.65;color:var(--ink2)}
/* SOP 一小节：小标题 + 用什么/怎么算/手算/为什么 对齐成两列 + 公式等宽 + 坑单独标。
   注意别叫 .step——那个类名在上面已经被流程行用掉了（display:flex）。 */
.sop{border-top:1px solid var(--line);padding:16px 0 4px}
.sop:first-child{border-top:0;padding-top:4px}
.sop .sn{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 11px;line-height:1.45;display:block}
.sop .sn i{font-style:normal;color:var(--accent);font-family:var(--mono);font-size:14px;letter-spacing:.03em;margin-right:8px}
.sop .f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 10px;align-items:baseline}
.sop .lb{font-size:13.5px;color:var(--accent);font-weight:700;white-space:nowrap;letter-spacing:.04em;justify-self:end;padding-top:3px}
.sop .tx{font-size:16px;line-height:1.72;color:var(--ink2);white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.sop .mono{font-family:var(--mono);font-size:15px;line-height:1.8;background:var(--soft);border-radius:8px;
  padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);margin:0}
/* 公式和手算占满整行——挤在右半栏的话，→ 会被折行折散，对不齐就看不懂了 */
.sop .f>.fw{grid-column:1/-1}
.sop .f>.lbf{grid-column:1/-1;justify-self:start;padding-top:2px}
.sop .wn{margin-top:11px;font-size:15.5px;line-height:1.7;color:var(--wn);background:var(--wnbg);
  border-left:2px solid var(--wnline);border-radius:0 8px 8px 0;padding:9px 12px;white-space:pre-line}

.whole{font-size:17px;line-height:1.7;color:var(--accent);margin:12px 0 14px;padding-left:11px;border-left:2px solid var(--accentSoft)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 配置与 GitHub 读写 ============ */
const LS="rl.cfg";
const cfg=(()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}})();
const THK="rl.theme";
function theme(){try{return localStorage.getItem(THK)||"auto"}catch(e){return "auto"}}
function applyTheme(t){
  try{localStorage.setItem(THK,t)}catch(e){}
  const light = t==="light" || (t==="auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.setAttribute("data-theme",light?"light":"dark");
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",light?"#F6F4EF":"#0D0D0C");
}
try{window.matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(theme()==="auto")applyTheme("auto")})}catch(e){}
applyTheme(theme());
function saveCfg(){try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}}
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const SHA={};
async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/${path}`,{...opt,headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json",...(opt.headers||{})},cache:"no-store"});
  if(!r.ok){const t=await r.text();throw new Error(`${r.status} ${path}：${t.slice(0,120)}`)}
  return r.json();
}
async function get(path){const j=await gh(path);SHA[path]=j.sha;return JSON.parse(b64d(j.content))}
async function put(path,obj,msg){
  if(!SHA[path]){try{const j=await gh(path);SHA[path]=j.sha}catch(e){}}
  const body={message:msg||`更新 ${path}`,content:b64e(JSON.stringify(obj,null,2)+"\n")};
  if(SHA[path]) body.sha=SHA[path];
  try{const j=await gh(path,{method:"PUT",body:JSON.stringify(body)});SHA[path]=j.content.sha;}
  catch(e){
    const m=String(e.message);
    if(m.startsWith("422")||m.startsWith("409")){
      try{const cur=await gh(path);body.sha=SHA[path]=cur.sha;
          const j2=await gh(path,{method:"PUT",body:JSON.stringify(body)});SHA[path]=j2.content.sha;return}
      catch(e2){throw new Error("数据在别处被改过了，下拉刷新后再试")}
    }
    throw e}
}

  return {n:rs.length,ev,ago:ok?days+" 天":"从没确认过",ago2:ok?days+" 天没确认":"从没确认过",agoBad:!ok||days>30,wait};

  if(pf) hit=hit.filter(m=>m.proj===pf);
  if(q) hit=hit.filter(m=>(m.name+" "+m.when+" "+m.what).toLowerCase().includes(q));
  if(q) return `<div class="small">找到 ${hit.length} 条</div>`+
    (hit.length?hit.map(m=>mRow(m,true)).join(""):'<div class="card small">没有找到。换个词试试，搜的是名字和「什么时候用得上」。</div>');

// 一条「怎么做到的」。带 n 的是结构化写法（用什么 / 怎么算 / 手算 / 为什么），
// 照 SOP 细则的排版来——压成一大段流水句人是看不懂的。没有 n 的是老格式 {t,wbs}。
const LBS0={use:"用什么",calc:"怎么算",ex:"手算",why:"为什么",now:"今天"};
const lbsOf=pj=>({...LBS0,...(pj?.sop?.labels||{})});
function stepHTML(h,LBS=LBS0){
  if(!h.n) return `<div class="kv"><span class="v">${esc(h.t||"")}${h.wbs?`<span class="meta">　${esc(h.wbs)}</span>`:""}</span></div>`;
  // 文字两栏对齐；公式/手算占满整行，不然 → 会被折散
  const row=(k,mono)=>!h[k]?"":mono
    ? `<span class="lb lbf">${LBS[k]}</span><div class="mono fw">${esc(h[k])}</div>`
    : `<span class="lb">${LBS[k]}</span><span class="tx">${esc(h[k])}</span>`;
  const i=String(h.n).indexOf("　"),num=i>0?String(h.n).slice(0,i):"",ttl=i>0?String(h.n).slice(i+1):String(h.n);
  return `<div class="sop">
    <div class="sn">${num?`<i>${esc(num)}</i>`:""}${esc(ttl)}</div>
    <div class="f">${row("use")}${row("calc",1)}${row("ex",1)}${row("why")}${row("now")}</div>
    ${h.warn?`<div class="wn">⚠ ${esc(h.warn)}</div>`:""}
  </div>`;
}

async function reanalyze(id){
  const P=D.p[id];
  // 锁定今天页这一刻显示的就是哪一行。同一天可能有好几行，所以必须带下标。
  const row=focusRow(P),idx=P.rows.indexOf(row);
  P.current.focus={date:row?.date||null,idx,q:row?.q||""};
  P.current.rowDate=row?.date||P.current.rowDate;
  P.current.q=row?.q||P.current.q;
  P.current.night={status:"wait",deadline:next8(),retries:0,error:null,
                   requestedAt:new Date().toISOString(),requestedBy:"在网页上点了重新分析"};
  try{
    await put(`projects/${id}/current.json`,P.current,"标为待分析（用户点了重新分析）");
    if(id===cur()) await put("widget.json",widgetFrom(id,P),"小组件：等待分析");
    toast("已排队。下一个整点前会跑");
  }catch(e){toast("排队失败："+e.message)}
}

function fmtDays(r){            // 闭环耗时：按日历天算，不按小时
  if(r.f!=="够用了") return "—";
  if(!r.closedAt) return '<span class="meta">没记</span>';
  const a=r.date,b=String(r.closedAt).slice(0,10);
  if(b<=a) return "当天";
  return Math.round((new Date(b)-new Date(a))/864e5)+"天";
}
function realityBlock(id,P){
  const R=P.iteration.reality||{};
  const hits=P.rows.filter(r=>r.cols?.[REALC]==="有");      // 这张表只装真撞了现实的
  const n=k=>hits.filter(r=>r.f===k).length;
  const list=sortRows(hits).filter(r=>!S.rfilter||r.f===S.rfilter);
  const ix=r=>P.rows.indexOf(r);
  const chain=(R.sum||[]).map((c,j)=>fold("rc"+j,c.t,esc(c.one||""),
    `<div class="evi" style="margin-top:2px">${(c.steps||[]).map(esc).join("\n")}</div>`)).join("");
  const bar=`<div class="row" style="flex-wrap:wrap;gap:8px;margin:2px 0 10px">
    ${STS.filter(k=>n(k)).map(k=>`<button class="fp${S.rfilter===k?" on":""}" data-rfilter="${k}"><b>${n(k)}</b>${k}</button>`).join("")}
    ${S.rfilter?`<button class="fp" style="margin-left:auto" data-rfilter="">全部 ${hits.length}</button>`:""}</div>`;
  const table=`<div class="tbl"><table class="nowrap"><thead><tr>
      <th>日期</th><th>状态</th><th>闭环</th><th>现实</th><th>为什么要改</th><th>改后验证</th>
    </tr></thead><tbody>
    ${list.map(r=>`<tr data-go="row" data-arg="${r.date}|${ix(r)}|${id}">
      <td class="meta">${r.date.slice(5).replace("-","/")}</td>
      <td><span class="pill ${r.f==="够用了"?"ok":r.f==="待改"?"bd":""}">${esc(r.f)}</span></td>
      <td class="meta">${fmtDays(r)}</td>
      <td><span class="cell">${esc(r.q)}</span></td>
      <td><span class="cell">${esc(r.cols?.["为什么要改动"]||"—")}</span></td>
      <td><span class="cell">${esc(r.cols?.["改后验证"]||"—")}</span></td></tr>`).join("")
      ||'<tr><td colspan="6" class="meta" style="padding:14px 10px">这一类现在没有</td></tr>'}
  </tbody></table></div>
  <div class="meta" style="margin-top:8px">点任一行回到迭代清单那一条。没碰现实、纯想出来的改动不进这张表。</div>`;
  const prev=STS.filter(k=>n(k)).map(k=>k+" "+n(k)).join("　");
  return `<div class="card"><b>② Reality · 撞完之后发生了什么</b>
    <div class="meta" style="margin:6px 0 10px">${esc(R.note||"")}${R.updated?"　更新于 "+esc(R.updated):""}</div>
    ${chain||'<div class="small">还没有写因果链</div>'}
    <div style="margin-top:10px">${fold("rtbl","撞到现实的 "+hits.length+" 条",prev,bar+table)}</div>
  </div>`;
}

/* ============ 渲染 ============ */
function render(){
  const a=$("#app");let h;
  if(!cfg.token||S.screen==="settings") h=settings();
  else if(S.loading&&!D.global) h=`<div class="center">读取数据中…</div>`;
  else if(S.err&&!D.global) h=`<div class="body"><h1 class="h1">读取失败</h1><div class="banner bd">${esc(S.err)}</div><p class="small">检查令牌是否过期、仓库名是否正确，或网络是否正常。</p><button class="btn" data-reload>重试</button><button class="btn ghost" data-tab="settings">修改连接</button></div>`;
  else h=({today,row:rowPage,detail,project,node:nodePage,meth:methPage,method:methodPage,list:listPage,main:mainPage,iter,gate,system,ppl:pplPage,person:personPage,plist:()=>plist("p"),ilist:()=>plist("i")}[S.screen]||today)();
  const vb=S.newver?`<div class="banner ok tap" data-newver="1" style="margin:0 0 8px">有新版本 ${esc(S.newver)}（你现在是 ${APPVER}）· 点这里刷新</div>`:"";
  a.innerHTML=vb+h+(S.sheet?sheet():"")+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");
  if(S.screen==="project"&&!S.edit){drawEdges();fitBoard()}
}
// GitHub Pages 的 index.html 会被浏览器缓存很久，在手机上尤其顽固。
// 每次打开和每 10 分钟，拿当前地址带时间戳重取一次，比对里面的 APPVER。
async function checkVer(){
  try{
    const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});
    const m=(await r.text()).match(/const APPVER="(v[0-9-]+[a-z])"/);
    if(m&&m[1]!==APPVER&&S.newver!==m[1]){S.newver=m[1];render()}
  }catch(e){}
}
checkVer();setInterval(checkVer,600000);
let K=1,ZOOM=1;
function fitBoard(){
  const b=document.getElementById("board"),c=document.getElementById("cvs");if(!b||!c) return;
  const pj=D.p[S.arg||cur()]?.project,ns=pj?.sop?.nodes||[];if(!ns.length) return;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  ns.forEach(n=>{const el=document.querySelector(`.nd[data-nid="${n.id}"]`);
    const w=el?el.offsetWidth:150,h=el?el.offsetHeight:56;
    mnX=Math.min(mnX,n.x||0);mnY=Math.min(mnY,n.y||0);mxX=Math.max(mxX,(n.x||0)+w);mxY=Math.max(mxY,(n.y||0)+h)});
  const pad=16,W=mxX-mnX+pad*2,H=mxY-mnY+pad*2,cw=b.clientWidth||600;
  // 原来只按宽度缩放、高度被 62vh 一刀切，长链（量化 SOP 有 11 个节点排成一竖列）
  // 会被从下面剪掉。改成宽高同时满足，框子本身也放到 82vh，尽量把整张图放进来。
  const maxH=Math.max(360,Math.round(window.innerHeight*0.82));
  K=Math.min(cw/W,maxH/H,1)*ZOOM;
  // 宽屏下整张图比框子窄（量化 SOP 只占 712px），不居中的话图全挤在左边、右边一大片空
  const ox=ZOOM>1?0:Math.max(0,(cw-W*K)/2);
  c.style.transform=`translate(${(-mnX+pad)*K+ox}px,${(-mnY+pad)*K}px) scale(${K})`;
  b.style.height=Math.round(Math.min(H*K+2,maxH))+"px";
  b.classList.toggle("zoom",ZOOM>1);
  const z=document.getElementById("zl");if(z)z.textContent=Math.round(K*100)+"%";
}
window.addEventListener("resize",()=>{if(S.screen==="project")fitBoard()});
/* ---- SOP 白板 ---- */
function nodesOf(){const id=S.arg||cur();return (D.p[id]?.project?.sop)||{}}
function anchorPt(a,b,ea,eb){
  const aw=ea.offsetWidth,ah=ea.offsetHeight,bw=eb.offsetWidth,bh=eb.offsetHeight;
  const ax=(a.x||0)+aw/2,ay=(a.y||0)+ah/2,bx=(b.x||0)+bw/2,by=(b.y||0)+bh/2,dx=bx-ax,dy=by-ay;
  if(!dx&&!dy) return [ax,ay];
  const sx=dx?(aw/2+4)/Math.abs(dx):1e9, sy=dy?(ah/2+4)/Math.abs(dy):1e9, s=Math.min(sx,sy);
  return [ax+dx*s,ay+dy*s];
}
function drawEdges(){
  const g=document.getElementById("eg");if(!g) return;
  const sop=nodesOf(),ns=sop.nodes||[];g.innerHTML="";
  (sop.edges||[]).forEach(([f,t])=>{
    const a=ns.find(n=>n.id===f),b=ns.find(n=>n.id===t);if(!a||!b) return;
    const ea=document.querySelector(`.nd[data-nid="${f}"]`),eb=document.querySelector(`.nd[data-nid="${t}"]`);
    if(!ea||!eb) return;
    const p1=anchorPt(a,b,ea,eb),p2=anchorPt(b,a,eb,ea);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`);
    p.setAttribute("stroke",getComputedStyle(document.documentElement).getPropertyValue("--edge").trim()||"#8A7B58");p.setAttribute("stroke-width","1.5");
    p.setAttribute("fill","none");p.setAttribute("marker-end","url(#ah)");
    g.appendChild(p);
  });
}
let drag=null;
document.addEventListener("pointerdown",e=>{
  const d=e.target.closest(".nd");if(!d||S.screen!=="project") return;
  const sop=nodesOf(),n=(sop.nodes||[]).find(x=>x.id===d.dataset.nid);if(!n) return;
  drag={n,el:d,sx:e.clientX,sy:e.clientY,ox:n.x||0,oy:n.y||0,moved:0};
  d.setPointerCapture(e.pointerId);d.classList.add("drag");
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=(e.clientX-drag.sx)/K,dy=(e.clientY-drag.sy)/K;
  const nx=Math.max(0,drag.ox+dx),ny=Math.max(0,drag.oy+dy);
  drag.moved=Math.abs(dx)+Math.abs(dy);
  drag.n.x=nx;drag.n.y=ny;drag.el.style.left=nx+"px";drag.el.style.top=ny+"px";drawEdges();
});
document.addEventListener("pointerup",()=>{
  if(!drag) return;
  const {n,el,moved}=drag;el.classList.remove("drag");drag=null;
  if(moved>6){if(!S.moved){S.moved=true;render()}return}
  if(n.kind!=="plain") go("node",(S.arg||cur())+"|"+n.id);
});

/* ============ 操作 ============ */
async function pick(id){
  S.sheet=false;render();
  try{
    const P=await loadProject(id,true);
    D.global.current=id;
    await put("global.json",D.global,`切换当前项目：${P.project.name}`);
    await put("widget.json",widgetFrom(id,P),`小组件：${P.project.name}`);
    toast("已切换，小组件下次刷新时显示「"+P.project.name+"」");
  }catch(e){toast("切换失败："+e.message)}
}
async function setStatus(i,st){
  const id=cur(),P=D.p[id],r=P.rows[i];
  r.f=st;
  if(st==="够用了"&&!r.closedAt) r.closedAt=new Date().toISOString();  // 记闭环时刻，用来算耗时
  if(st!=="够用了") delete r.closedAt;
  render();
  await saveRows(id,`改状态：${st}`);
  await syncFocus(id);          // 标成够用了/不做之后，今天页要换下一条
}
async function delRow(i){
  const id=cur(),P=D.p[id];const r=P.rows[i];
  if(!confirmDel){confirmDel=true;toast("再点一次「删除这一条」才真的删");setTimeout(()=>confirmDel=false,4000);return}
  confirmDel=false;P.rows.splice(i,1);
  try{await put(`projects/${id}/rows.json`,P.rows,`删除一条：${(r.q||"").slice(0,20)}`);toast("已删除");go("list",id)}
  catch(e){toast("删除失败："+e.message);P.rows.splice(i,0,r)}
}
let confirmDel=false,IME=false;
document.addEventListener("compositionstart",e=>{if(e.target.id==="msrch")IME=true});
document.addEventListener("compositionend",e=>{
  if(e.target.id!=="msrch") return;
  IME=false;S.q=e.target.value;const b=$("#mbody");if(b)b.innerHTML=methBody();
});
document.addEventListener("blur",e=>{
  const t=e.target,k=t?.dataset?.rk;if(!k) return;
  const [is,key]=k.split("|"),i=+is,id=cur(),P=D.p[id];if(!P||!P.rows[i]) return;
  const row=P.rows[i],pj=P.project,v=t.innerText.trim();
  const LF=pj.labels?.f||"今日发现",LQ=pj.labels?.q||"留给明天的问题";
  let changed=false;
  if(key===LF){if(row.f!==v){row.f=v;changed=true}}
  else if(key===LQ){if(row.q!==v){row.q=v;changed=true}}
  else{row.cols=row.cols||{};if((row.cols[key]||"")!==v){row.cols[key]=v;changed=true}}
  if(!changed) return;
  const daily=!pj.labels;                       // 没自定义标签的是每天一行的项目
  if(daily&&key===LQ&&row.date===P.current.rowDate){
    P.current.voided=[...(P.current.voided||[]),{q:P.current.q,at:new Date().toISOString()}];
    P.current.q=v;P.current.writtenAt=new Date().toISOString();
    P.current.night={status:"wait",deadline:next8(),retries:0,error:null,requestedBy:"用户改问题"};
    row.night=null;
    (async()=>{try{
      await put(`projects/${id}/rows.json`,P.rows,`改问题：${v}`);
      await put(`projects/${id}/current.json`,P.current,`改问题：${v}`);
      if(id===cur()) await put("widget.json",widgetFrom(id,P),"小组件：问题已更新");
      toast("原问题已作废。在对话里说「重新分析」即可马上开始");
    }catch(e){toast("保存失败："+e.message)}})();
    return;
  }
  saveRows(id,`修改 ${key}`);
},true);
async function saveRows(id,msg,loud){
  const P=D.p[id];
  try{await put(`projects/${id}/rows.json`,P.rows,msg);
      if(loud){toast("已保存");render()}else{S.toast="已保存";render();setTimeout(()=>{S.toast="";render()},1500)}}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("input",e=>{
  if(e.target.id==="msrch"){
    if(IME) return;                      // 中文拼音还在拼，先别动
    S.q=e.target.value;const b=$("#mbody");if(b)b.innerHTML=methBody();return}
  const i=e.target.dataset?.pri;if(i==null) return;
  // S.arg 在行详情页是「日期|下标」，不是项目 id。直接拿它当 key 会取到 undefined，
  // 于是整个处理提前 return——改了优先分只留在输入框里，刷新就没了。
  const P=D.p[projId()];if(!P) return;
  P.rows[+i].cols=P.rows[+i].cols||{};P.rows[+i].cols[PRI]=e.target.value.trim();
  if(!S.priDirty){S.priDirty=true}
  const b=document.querySelector("[data-savepri]");
  if(b) b.style.display="";else render();   // 不整页重绘，否则输入框会失焦、刚敲的字被踢掉
});

// 优先分：离开输入框（或按回车）就直接存。
// 之前只能靠表格最下面那个「保存优先分」按钮，而在行详情页它被 31 行表格挡在最底下，
// 人在页面顶部改完根本看不见它，改了就走 = 白改。
document.addEventListener("change",async e=>{
  if(e.target?.dataset?.pri==null) return;
  const id=projId(),P=D.p[id];if(!P) return;
  S.priDirty=false;
  const b=document.querySelector("[data-savepri]");if(b)b.style.display="none";
  await saveRows(id,"更新优先程度");
  await syncFocus(id);
  render();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target?.dataset?.pri!=null) e.target.blur();
});
async function saveProject(id,msg,quiet){
  const P=D.p[id];
  try{await put(`projects/${id}/project.json`,P.project,msg);S.moved=false;
      if(quiet){S.toast="已保存";const el=document.querySelector(".toast");if(!el)render();setTimeout(()=>{S.toast="";if(S.screen==="project")render()},1600);}
      else{toast("已保存");render()}}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("blur",e=>{
  const t=e.target,k=t?.dataset?.p;if(!k||S.screen!=="project") return;
  const id=S.arg||cur(),pj=D.p[id]?.project;if(!pj) return;
  const v=t.innerText.trim(),m=pj.mainline=pj.mainline||{},d=pj.doing=pj.doing||{};
  const sp=s=>s.split(/[；;]/).map(x=>x.trim()).filter(Boolean);
  const before=JSON.stringify([pj.goal,pj.reward,pj.reality,d.what,d.reality,d.evidence,m.main,m.evolved,m.branches]);
  if(k==="目标")pj.goal=v; else if(k==="奖励的行为")pj.reward=v;
  else if(k==="什么才算“碰到现实”")pj.reality=v;
  else if(k==="在做的事")d.what=v; else if(k==="现实进展到哪")d.reality=v;
  else if(k==="这个判断靠什么")d.evidence=v;
  else if(k==="主线")m.main=v; else if(k==="由主线演化出来的")m.evolved=sp(v);
  else if(k==="支线")m.branches=sp(v);
  if(JSON.stringify([pj.goal,pj.reward,pj.reality,d.what,d.reality,d.evidence,m.main,m.evolved,m.branches])!==before)
    saveProject(id,`修改${k}：${pj.name}`);
},true);
function saveNode(pid,nid){
  const n=(D.p[pid].project.sop?.nodes||[]).find(x=>x.id===nid);if(!n) return;
  n.whole=$("#n_whole").value.trim();n.concl=$("#n_concl").value.trim();
  n.so=$("#n_so").value.trim();n.judge=$("#n_judge").value.trim();
  (n.how||[]).forEach((h,i)=>{
    if(h.n){["use","calc","ex","why","now","warn"].forEach(k=>{const el=$("#n_"+k+i);if(el)h[k]=el.value.trim()})}
    else{const el=$("#n_h"+i);if(el)h.t=el.value.trim()}
  });
  (n.pains||[]).forEach((p,i)=>{
    const v=($("#n_p"+i)?.value||"").trim(),sol=$("#n_s"+i)?.checked;
    p.solved=!!sol; if(sol){p.fix=v;delete p.gap}else{p.gap=v;delete p.fix}
  });
  return saveProject(pid,`修改 SOP 节点：${n.name}`);
}
function addMethod(){
  const arr=D.meth.methods=D.meth.methods||[];
  let n=1;while(arr.some(m=>m.id==="m-"+String(n).padStart(3,"0"))) n++;
  const t=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const m={id:"m-"+String(n).padStart(3,"0"),cat:(D.meth.cats||[])[0]||"每天怎么跑",
           proj:cur(),projName:D.p[cur()]?.project?.name||"",
           name:"新方法",when:"",what:"",src:(+t.slice(5,7))+"/"+(+t.slice(8,10)),refs:[t]};
  arr.push(m);S.edit=true;go("method",m.id);
}
function saveMethod(id){
  const m=findM(id);if(!m) return;
  m.name=$("#m_name").value.trim()||"未命名";
  m.what=$("#m_what").value.trim();
  m.when=$("#m_when").value.trim();
  m.src=$("#m_src").value.trim();
  m.refs=[...new Set((m.src.match(/(\d{1,2})\/(\d{1,2})/g)||[]).map(t=>{
    const [a,b]=t.split("/");return `2026-${String(+a).padStart(2,"0")}-${String(+b).padStart(2,"0")}`}))];
  S.edit=false;
  return saveMethods(`方法：${m.name}`);
}
async function delMethod(id){
  if(!confirmDel){confirmDel=true;toast("再点一次「删除这条方法」才真的删");setTimeout(()=>confirmDel=false,4000);return}
  confirmDel=false;
  const arr=D.meth.methods,i=arr.findIndex(m=>m.id===id);if(i<0) return;
  const [m]=arr.splice(i,1);
  try{await put("methods.json",D.meth,`删除方法：${m.name}`);S.edit=false;toast("已删除");tab("meth")}
  catch(e){arr.splice(i,0,m);toast("删除失败："+e.message)}
}
async function decide(id,i,opt){
  const P=D.p[id];const g=P.iteration.gates[i];
  g.decision={option:opt,reason:($("#reason"+i)?.value||"").trim(),at:new Date().toISOString()};
  try{await put(`projects/${id}/iteration.json`,P.iteration,`Human Gate：${g.title} → ${opt}`);toast("已记录你的决定");render()}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-stop]")&&!e.target.closest("[data-pick]")) return;
  const t=e.target.closest("[data-go],[data-back],[data-tab],[data-sheet],[data-closesheet],[data-pick],[data-open],[data-toggle],[data-edit],[data-canceledit],[data-decide],[data-savecfg],[data-reload],[data-savenode],[data-saveboard],[data-zoom],[data-node],[data-filter],[data-savepri],[data-newver],[data-addrow],[data-tofilter],[data-setst],[data-delrow],[data-setreal],[data-rfilter],[data-addm],[data-savem],[data-delm],[data-setcat],[data-mproj],[data-gap],[data-newgap],[data-savegap],[data-cancelgap],[data-delgap],[data-setth],[data-reanalyze],[data-addppl],[data-saveppl],[data-delppl]");
  if(!t) return;const d=t.dataset;
  if(d.gap!=null){S.gap=d.gap;S.newgap=false;return render()}
  if(d.newgap){S.newgap=true;return render()}
  if(d.cancelgap){S.newgap=false;return render()}
  if(d.savegap) return addGap(d.savegap);
  if(d.delgap){const [pid,gid]=d.delgap.split("|");return delGap(pid,gid)}
  if(d.setth){applyTheme(d.setth);return render()}
  if(d.addppl) return addPerson(d.addppl);
  if(d.saveppl){const [pid,i]=d.saveppl.split("|");return savePerson(pid,+i)}
  if(d.delppl){const [pid,i]=d.delppl.split("|");return delPerson(pid,+i)}
  if(d.reanalyze) return reanalyze(d.reanalyze);
  if("addm" in d) return addMethod();
  if(d.savem) return saveMethod(d.savem);
  if(d.delm) return delMethod(d.delm);
  if(d.setcat){const [id,c]=d.setcat.split("|");const m=findM(id);if(m){m.cat=c;render()}return}
  if(d.mproj!=null){S.mproj=d.mproj||"";return render()}
  if(d.zoom){ZOOM=d.zoom==="fit"?1:(d.zoom==="+"?Math.min(3,ZOOM*1.3):Math.max(.6,ZOOM/1.3));return fitBoard()}
  if(d.node) return go("node",(S.arg||cur())+"|"+d.node);
  if(d.filter!=null){S.filter=S.filter===d.filter?null:d.filter;return render()}
  if(d.rfilter!=null){S.rfilter=S.rfilter===d.rfilter?"":d.rfilter;return render()}
  if(d.tofilter){const [pid,k]=d.tofilter.split("|");S.filter=k;return go("list",pid)}
  if(d.newver){location.replace(location.pathname+"?v="+encodeURIComponent(S.newver||Date.now()));return}
  if(d.savepri){S.priDirty=false;return saveRows(d.savepri,"更新优先程度",true).then(()=>syncFocus(d.savepri)).then(render)}
  if(d.setst){const [i,st]=d.setst.split("|");return setStatus(+i,st)}
  if(d.setreal){const [i,v]=d.setreal.split("|");const P=D.p[cur()],r=P.rows[+i];
    r.cols=r.cols||{};r.cols[REALC]=r.cols[REALC]===v?"":v;render();
    return saveRows(cur(),`碰现实了吗：${r.cols[REALC]||"清空"}`)}
  if(d.delrow!=null) return delRow(+d.delrow);
  if("addrow" in d){
    const id=S.arg||cur(),P=D.p[id],c={};(P.project.columns||[]).forEach(k=>c[k]="");
    P.rows.push({date:new Date().toISOString().slice(0,10),f:"待改",q:"",cols:c,night:null});
    return go("row",P.rows[P.rows.length-1].date+"|"+(P.rows.length-1));
  }
  if(d.go){if((d.go==="project"||d.go==="iter")&&!d.arg){go(d.go,cur())}else go(d.go,d.arg);return}
  if("back" in d) return back();
  if(d.tab) return tab(d.tab);
  if("sheet" in d){S.sheet=true;return render()}
  if("closesheet" in d){S.sheet=false;return render()}
  if(d.pick) return pick(d.pick);
  if(d.open){try{await loadProject(d.open)}catch(err){return toast(err.message)}return go(d.target,d.open)}
  if(d.toggle){S.open[d.toggle]=!S.open[d.toggle];return render()}
  if("edit" in d){S.edit=true;return render()}
  if("canceledit" in d){S.edit=false;return render()}
  if(d.savenode){const [pid,nid]=d.savenode.split("|");return saveNode(pid,nid)}
  if("saveboard" in d) return saveProject(S.arg||cur(),"调整 SOP 图的节点位置");
  if(d.decide){const [id,i,o]=d.decide.split("|");return decide(id,+i,o)}
  if("savecfg" in d){cfg.owner=$("#owner").value.trim();cfg.repo=$("#repo").value.trim();cfg.token=$("#token").value.trim();saveCfg();S.screen="today";return loadAll()}
  if("reload" in d){D.p={};return loadAll()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".tap")) e.target.click()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cfg.token){D.p={};loadAll()}});
render(); if(cfg.token) loadAll();
</script>
