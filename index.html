<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天">
<meta name="theme-color" content="#0D0D0C">
<title>强化学习系统</title>
<!-- build 2026-09-23i -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0D0D0C; --paper:#171716; --ink:#FFFFFF; --ink2:#E2DED6; --ink3:#A39C8E;
  --line:#33322D; --soft:#201F1C; --accent:#E5C463; --accentSoft:#3B3218; --bad:#E88E74; --badSoft:#3A2318; --onAccent:#12110F;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden}
body{overflow-x:hidden}
body{margin:0;background:radial-gradient(130% 42% at 50% 0%,#2A2416 0%,var(--ground) 62%) fixed,var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;overflow-x:hidden}
.body{flex:1;min-width:0;max-width:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;display:flex;flex-direction:column;gap:12px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(13,13,12,.96);backdrop-filter:blur(10px);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.nav button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink3);padding:6px 0;cursor:pointer}
.nav button[aria-current="true"]{color:var(--accent);font-weight:700}
button{font:inherit}
button:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.back{font-size:16px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.h1{font-family:var(--serif);font-size:27px;font-weight:900;margin:0}
.h2{font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin:6px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.chev{margin-left:auto;color:var(--ink3);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.meta{font-size:13px;color:var(--ink3);font-family:var(--mono)}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.ok{background:var(--accentSoft);color:var(--accent)} .bd{background:var(--badSoft);color:var(--bad)}
.q{font-family:var(--serif);color:#FFF6E6;font-size:21px;font-weight:700;line-height:1.45;margin:0;text-wrap:balance}
.lbl{font-size:13.5px;color:var(--accent);font-weight:700;width:38px;flex:none}
.line3{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.65}
.line3:first-child{border-top:0}
.line3 .txt{flex:1;min-width:0}
.btn{font-weight:700;font-size:16.5px;background:var(--accent);color:var(--onAccent);border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15.5px;padding:12px}
.btn:disabled{opacity:.5}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.small{font-size:14px;color:var(--ink2);line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px}
.tbl table{border-collapse:collapse;font-size:14px;min-width:620px;width:100%}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl th{color:var(--ink3);background:var(--soft);white-space:nowrap}
.tbl tr.sel td{background:var(--accentSoft)}
.tbl tbody tr{cursor:pointer}
.kv{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13.5px;color:var(--accent);font-weight:700}
.kv .v{font-size:16px;line-height:1.7;white-space:pre-line}
.step{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:16px;cursor:pointer}
.step .n{font-family:var(--mono);width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11px;flex:none}
.arrow{padding-left:5px;color:var(--accent);opacity:.6;font-size:14px}
.sub{margin:2px 0 6px 30px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.recall{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.recall:first-child{border-top:0}
.recall .t{font-weight:700;font-size:16px}
.recall .w{font-size:15px;color:var(--ink2);line-height:1.6}
.tag{font-size:12.5px;font-weight:700;color:var(--accent)}
.evi{margin-top:8px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-line}
.cmp{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.cmp td,.cmp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--ink3);font-size:12.5px}
textarea,input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.6}
textarea{min-height:70px;resize:vertical}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .in{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--onAccent);font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px;z-index:9;max-width:90%;text-align:center}
.ed{border-radius:8px;padding:3px 7px;margin:0 -7px;min-height:1.7em;transition:background .15s}
.ed:hover{background:var(--soft)}
.ed:focus{outline:none;background:var(--soft);box-shadow:0 0 0 1px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:#5B554A}
.prev{color:var(--ink3);font-size:14.5px;line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pw{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.pw .pin{width:44px}
.fold{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:15.5px}
.fold.sm{font-size:15px;padding:10px 0}
.fold.sm .meta{margin-left:auto}
.mg{border-top:1px solid var(--soft)}
.mg:first-child{border-top:0}
.mg .line3{padding-left:10px;font-size:15px}
.srch{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);margin-bottom:10px;-webkit-appearance:none}
.srch:focus{outline:none;border-color:var(--accent)}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tag.m{color:var(--ink);background:var(--accentSoft);border-radius:5px;padding:2px 7px}
.how{margin-top:8px;padding:11px 12px;background:var(--accentSoft);border-radius:10px;font-size:15px;line-height:1.65;color:var(--ink2)}
.how b{display:block;color:var(--accent);font-size:13px;margin-bottom:3px}
.btn.ghost.bd{color:var(--bad);border-color:var(--bad)}
.center{display:grid;place-items:center;min-height:60vh;color:var(--ink3);font-size:16px}
/* SOP 白板 */
.board{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background-image:radial-gradient(#312C25 1px,transparent 1px);background-size:20px 20px}
.board.zoom{overflow:auto}
.cvs{position:relative;width:1100px;height:860px;transform-origin:0 0}
.zc{display:flex;gap:6px;align-items:center;margin-top:8px}
.zc button{font:inherit;font-size:13.5px;background:var(--paper);border:1px solid var(--line);color:var(--ink3);border-radius:999px;padding:4px 12px;cursor:pointer}
.zc .z{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:4px}
.flow{display:none;margin-top:10px}
.fl{display:flex;gap:8px;justify-content:center}
.fn{flex:1;min-width:0;background:var(--soft);border:1px solid #4A4636;border-radius:11px;padding:13px 12px;cursor:pointer}
.fn.plain{border-style:dashed;background:transparent;cursor:default;text-align:center}
.fn .t{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;gap:4px}
.fn.plain .t{color:var(--ink);justify-content:center}
.fn .q{color:var(--ink2);font-size:12.5px;line-height:1.5;margin-top:3px}
.fa{text-align:center;color:var(--accent);opacity:.65;font-size:15px;line-height:1;padding:8px 0}
.fp{font:inherit;font-size:14px;color:var(--ink3);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.fp b{color:var(--ink);margin-right:6px;font-weight:700}
.fp.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.fp.on b{color:var(--accent)}
.pin{width:40px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--accent);font:13px var(--mono);text-align:center;padding:4px 0}
.pin:focus{outline:none;border-color:var(--accent);background:var(--soft)}
.pin::placeholder{color:#514A3F}
.tbl td .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.nowrap td{height:44px;vertical-align:middle;padding:0 10px}
@media(max-width:700px){.board,.zc{display:none}.flow{display:block}}
.cvs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nd{position:absolute;width:150px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:grab;user-select:none}
.nd.plain{border-style:dashed;background:transparent}
.nd.drag{cursor:grabbing;border-color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:9}
.nd .t{font-family:var(--mono);font-size:12.5px;color:var(--accent);display:flex;justify-content:space-between;gap:6px;align-items:center}
.nd.plain .t{color:var(--ink)}
.nd .q{color:var(--ink3);font-size:11px;line-height:1.45;margin-top:3px}
/* 痛点 */
.pain{border-left:2px solid var(--accentSoft);padding-left:11px;margin:0 0 13px}
.pain.un{border-left-color:var(--line);opacity:.8}
.pain .pp{font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.pain.un .pp{color:var(--ink3)}
.pain .fx{font-size:11px;letter-spacing:.06em;color:#8FB489;margin:7px 0 3px}
.pain.un .fx{color:var(--ink3)}
.pain p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink2)}
.whole{font-size:17px;line-height:1.7;color:var(--accent);margin:12px 0 14px;padding-left:11px;border-left:2px solid var(--accentSoft)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 配置与 GitHub 读写 ============ */
const LS="rl.cfg";
const cfg=(()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}})();
function saveCfg(){try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}}
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const SHA={};
async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/${path}`,{...opt,headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json",...(opt.headers||{})},cache:"no-store"});
  if(!r.ok){const t=await r.text();throw new Error(`${r.status} ${path}：${t.slice(0,120)}`)}
  return r.json();
}
async function get(path){const j=await gh(path);SHA[path]=j.sha;return JSON.parse(b64d(j.content))}
async function put(path,obj,msg){
  if(!SHA[path]){try{const j=await gh(path);SHA[path]=j.sha}catch(e){}}
  const body={message:msg||`更新 ${path}`,content:b64e(JSON.stringify(obj,null,2)+"\n")};
  if(SHA[path]) body.sha=SHA[path];
  try{const j=await gh(path,{method:"PUT",body:JSON.stringify(body)});SHA[path]=j.content.sha;}
  catch(e){
    const m=String(e.message);
    if(m.startsWith("422")||m.startsWith("409")){
      try{const cur=await gh(path);body.sha=SHA[path]=cur.sha;
          const j2=await gh(path,{method:"PUT",body:JSON.stringify(body)});SHA[path]=j2.content.sha;return}
      catch(e2){throw new Error("数据在别处被改过了，下拉刷新后再试")}
    }
    throw e}
}

/* ============ 状态 ============ */
const D={global:null,index:[],status:null,p:{},meth:null};
const S={screen:"today",arg:null,stack:[],open:{},sheet:false,edit:false,loading:true,err:"",toast:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>D.global?.current;
async function loadProject(id,force){
  if(D.p[id]&&!force) return D.p[id];
  const [project,rows,current,iteration]=await Promise.all(["project","rows","current","iteration"].map(n=>get(`projects/${id}/${n}.json`)));
  return D.p[id]={project,rows,current,iteration};
}
async function loadAll(){
  S.loading=true;S.err="";render();
  try{
    [D.global,D.index,D.status,D.meth]=await Promise.all([get("global.json"),get("projects/index.json"),get("status.json").catch(()=>null),get("methods.json").catch(()=>({name:"方法库",cats:[],methods:[]}))]);
    await loadProject(cur(),true);
  }catch(e){S.err=e.message}
  S.loading=false;render();
}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast="";render()},2200)}

/* ============ 工具 ============ */
function rel(iso){if(!iso)return"";const d=(Date.now()-new Date(iso))/864e5;if(d<1)return"今天";return Math.floor(d)+"天前"}
function nightState(c){
  const n=c.night||{};
  if(n.status==="done") return "done";
  if(n.status==="fail") return "fail";
  if(n.deadline&&Date.now()>new Date(n.deadline)) return "fail";
  return n.status||"wait";
}
// 写入新问题后，分析要在下一个早上 8:00（日本时间）之前跑出来；过了就算没跑成
function next8(){const d=new Date();const jst=new Date(d.getTime()+9*36e5);if(jst.getUTCHours()>=8)jst.setUTCDate(jst.getUTCDate()+1);jst.setUTCHours(8,0,0,0);return new Date(jst.getTime()-9*36e5).toISOString()}
const nightPill=st=>({done:'<span class="pill ok">夜间分析已完成</span>',wait:'<span class="pill ok">等待 AI 分析</span>',run:'<span class="pill ok">AI 分析中</span>',fail:'<span class="pill bd">夜间分析未完成</span>'}[st]);
function curRow(P){return P.rows.find(r=>r.date===P.current.rowDate)||P.rows[P.rows.length-1]}
function widgetFrom(id,P){
  const row=focusRow(P),n=row?.night||{};
  const isList=!!P.project.labels;
  return {project:id,name:P.project.name,
    q:isList?(row?.q||P.current.q):P.current.q,
    writtenAt:P.current.writtenAt,
    night:{status:P.current.night?.status||"wait",deadline:P.current.night?.deadline||null,error:P.current.night?.error||null,
      c:n.cs||"",r:n.r||"",x:n.recall?.[0]?.t||""}};
}

/* ============ 导航 ============ */
function go(screen,arg){S.stack.push({screen:S.screen,arg:S.arg});S.screen=screen;S.arg=arg;S.open={};S.edit=false;render();window.scrollTo(0,0)}
function back(){const b=S.stack.pop()||{screen:"today"};S.screen=b.screen;S.arg=b.arg;S.open={};S.edit=false;render()}
function tab(s){S.stack=[];S.screen=s;S.arg=null;S.open={};S.edit=false;if(s!=="meth"){S.q="";S.mproj=""}render();window.scrollTo(0,0)}
const nav=a=>`<nav class="nav">${[["today","今天"],["plist","项目"],["meth","方法"],["ilist","迭代"],["system","系统"]].map(([k,l])=>`<button data-tab="${k}" aria-current="${a===k}">${l}</button>`).join("")}</nav>`;
const topBar=(title,right="")=>`<div class="top"><button class="back" data-back>‹ 返回</button><span class="meta">${esc(right)}</span></div>${title?`<h2 class="h1" style="font-size:24px">${esc(title)}</h2>`:""}`;

/* ============ 页面 ============ */
function settings(){
  return `<div class="body"><h1 class="h1">连接数据</h1>
  <p class="small">第一次使用需要填写存数据的 GitHub 私有仓库。令牌只保存在这台手机的浏览器里。</p>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <label class="small" for="owner">GitHub 用户名</label><input id="owner" value="${esc(cfg.owner||"")}" autocapitalize="off">
    <label class="small" for="repo">数据仓库名</label><input id="repo" value="${esc(cfg.repo||"rl-data")}" autocapitalize="off">
    <label class="small" for="token">令牌（需要该仓库 Contents 读写权限）</label><input id="token" type="password" value="${esc(cfg.token||"")}">
  </div>
  <button class="btn" data-savecfg>保存并连接</button></div>`;
}
function focusRow(P){
  if(!P.project.labels) return curRow(P);           // 每天一行的项目：当前那一行
  const open=sortRows(P.rows).filter(r=>r.f!=="够用了"&&r.f!=="不做");
  return open[0]||sortRows(P.rows)[0]||P.rows[0];   // 清单型项目：优先分最高的未完成那一条
}
function today(){
  const id=cur(),P=D.p[id];if(!P) return `<div class="center">加载中…</div>`;
  const isList=!!P.project.labels;
  const st=nightState(P.current),row=focusRow(P),n=row?.night||{};
  const headline=isList?(row?.q||"清单里还没有内容"):P.current.q;
  const cnt={};P.rows.forEach(r=>cnt[r.f]=(cnt[r.f]||0)+1);
  let lines;
  const ri0=P.rows.indexOf(row);
  if(st==="done") lines=[["矛盾",n.cs,"c"],["结果",n.r,"r"],["召回",(n.recall?.[0]?.t||"")+(n.recall?.length?`<span class="meta">（共 ${n.recall.length} 条）</span>`:""),"x"]]
    .map(([l,t,k])=>`<div class="line3 tap" data-go="detail" data-arg="${k}|${esc(row?.date||"")}|${ri0}" tabindex="0"><span class="lbl">${l}</span><span class="txt">${t||'<span class="meta">—</span>'}</span><span class="chev">›</span></div>`).join("");
  else if(st==="fail") lines=`<div class="line3 tap" data-tab="system" tabindex="0"><span class="lbl" style="color:var(--bad)">⚠</span><span class="txt" style="color:var(--bad)">AI 夜间分析未完成${P.current.night?.error?"："+esc(P.current.night.error):"（7:00 前没有收到结果）"}。点击查看</span><span class="chev">›</span></div>`;
  else lines=["矛盾","结果","召回"].map(l=>`<div class="line3"><span class="lbl">${l}</span><span class="txt" style="color:var(--ink3)">${st==="run"?"AI 分析中…":"等待 AI 分析"}</span></div>`).join("");
  const gates=(P.iteration.gates||[]).filter(g=>!g.decision).length;
  const ri=P.rows.indexOf(row);
  return `<div class="body">
    <h1 class="h1">今天</h1>
    <div class="row" style="flex-wrap:wrap"><span class="chip" data-go="project" tabindex="0">${esc(P.project.name)} ›</span><span class="meta">${rel(P.current.writtenAt)}写入</span>${nightPill(st)}</div>

function layersOf(pj){
  const ns=pj.sop?.nodes||[],es=pj.sop?.edges||[],dep={};

  return L.filter(Boolean);

let K=1,ZOOM=1;
function fitBoard(){
  const b=document.getElementById("board"),c=document.getElementById("cvs");if(!b||!c) return;
  const pj=D.p[S.arg||cur()]?.project,ns=pj?.sop?.nodes||[];if(!ns.length) return;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  ns.forEach(n=>{const el=document.querySelector(`.nd[data-nid="${n.id}"]`);
    const w=el?el.offsetWidth:150,h=el?el.offsetHeight:56;
    mnX=Math.min(mnX,n.x||0);mnY=Math.min(mnY,n.y||0);mxX=Math.max(mxX,(n.x||0)+w);mxY=Math.max(mxY,(n.y||0)+h)});
  const pad=16,W=mxX-mnX+pad*2,H=mxY-mnY+pad*2,cw=b.clientWidth||600;
  K=Math.min(1,cw/W)*ZOOM;
  c.style.transform=`translate(${(-mnX+pad)*K}px,${(-mnY+pad)*K}px) scale(${K})`;
  b.style.height=Math.round(Math.min(H*K+2,window.innerHeight*0.62))+"px";
  b.classList.toggle("zoom",ZOOM>1);
  const z=document.getElementById("zl");if(z)z.textContent=Math.round(K*100)+"%";
}

function nodesOf(){const id=S.arg||cur();return (D.p[id]?.project?.sop)||{}}
function anchorPt(a,b,ea,eb){
  const aw=ea.offsetWidth,ah=ea.offsetHeight,bw=eb.offsetWidth,bh=eb.offsetHeight;
  const ax=(a.x||0)+aw/2,ay=(a.y||0)+ah/2,bx=(b.x||0)+bw/2,by=(b.y||0)+bh/2,dx=bx-ax,dy=by-ay;
  if(!dx&&!dy) return [ax,ay];
  const sx=dx?(aw/2+4)/Math.abs(dx):1e9, sy=dy?(ah/2+4)/Math.abs(dy):1e9, s=Math.min(sx,sy);
  return [ax+dx*s,ay+dy*s];
}
function drawEdges(){
  const g=document.getElementById("eg");if(!g) return;
  const sop=nodesOf(),ns=sop.nodes||[];g.innerHTML="";
  (sop.edges||[]).forEach(([f,t])=>{
    const a=ns.find(n=>n.id===f),b=ns.find(n=>n.id===t);if(!a||!b) return;
    const ea=document.querySelector(`.nd[data-nid="${f}"]`),eb=document.querySelector(`.nd[data-nid="${t}"]`);
    if(!ea||!eb) return;
    const p1=anchorPt(a,b,ea,eb),p2=anchorPt(b,a,eb,ea);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`);
    p.setAttribute("stroke","#8A7B58");p.setAttribute("stroke-width","1.5");
    p.setAttribute("fill","none");p.setAttribute("marker-end","url(#ah)");
    g.appendChild(p);
  });
}
let drag=null;
document.addEventListener("pointerdown",e=>{
  const d=e.target.closest(".nd");if(!d||S.screen!=="project") return;
  const sop=nodesOf(),n=(sop.nodes||[]).find(x=>x.id===d.dataset.nid);if(!n) return;

  d.setPointerCapture(e.pointerId);d.classList.add("drag");
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=(e.clientX-drag.sx)/K,dy=(e.clientY-drag.sy)/K;
  const nx=Math.max(0,drag.ox+dx),ny=Math.max(0,drag.oy+dy);
  drag.moved=Math.abs(dx)+Math.abs(dy);
  drag.n.x=nx;drag.n.y=ny;drag.el.style.left=nx+"px";drag.el.style.top=ny+"px";drawEdges();
});

      await put(`projects/${id}/rows.json`,P.rows,`改问题：${v}`);
      await put(`projects/${id}/current.json`,P.current,`改问题：${v}`);
      if(id===cur()) await put("widget.json",widgetFrom(id,P),"小组件：问题已更新");
      toast("原问题已作废。在对话里说「重新分析」即可马上开始");
    }catch(e){toast("保存失败："+e.message)}})();
    return;
  }
  saveRows(id,`修改 ${key}`);
},true);
async function saveRows(id,msg,loud){
  const P=D.p[id];
  try{await put(`projects/${id}/rows.json`,P.rows,msg);
      if(loud){toast("已保存");render()}else{S.toast="已保存";render();setTimeout(()=>{S.toast="";render()},1500)}}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("input",e=>{
  if(e.target.id==="msrch"){
    if(IME) return;                      // 中文拼音还在拼，先别动
    S.q=e.target.value;const b=$("#mbody");if(b)b.innerHTML=methBody();return}
  const i=e.target.dataset?.pri;if(i==null) return;
  const P=D.p[S.arg||cur()];if(!P) return;
  P.rows[+i].cols=P.rows[+i].cols||{};P.rows[+i].cols[PRI]=e.target.value.trim();
  if(!S.priDirty){S.priDirty=true;const b=document.querySelector("[data-savepri]");if(!b)render()}
});
async function saveProject(id,msg,quiet){
  const P=D.p[id];
  try{await put(`projects/${id}/project.json`,P.project,msg);S.moved=false;
      if(quiet){S.toast="已保存";const el=document.querySelector(".toast");if(!el)render();setTimeout(()=>{S.toast="";if(S.screen==="project")render()},1600);}
      else{toast("已保存");render()}}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("blur",e=>{
  const t=e.target,k=t?.dataset?.p;if(!k||S.screen!=="project") return;
  const id=S.arg||cur(),pj=D.p[id]?.project;if(!pj) return;
  const v=t.innerText.trim(),m=pj.mainline=pj.mainline||{},d=pj.doing=pj.doing||{};
  const sp=s=>s.split(/[；;]/).map(x=>x.trim()).filter(Boolean);
  const before=JSON.stringify([pj.goal,pj.reward,pj.reality,d.what,d.reality,d.evidence,m.main,m.evolved,m.branches]);
  if(k==="目标")pj.goal=v; else if(k==="奖励的行为")pj.reward=v;
  else if(k==="什么才算“碰到现实”")pj.reality=v;
  else if(k==="在做的事")d.what=v; else if(k==="现实进展到哪")d.reality=v;
  else if(k==="这个判断靠什么")d.evidence=v;
  else if(k==="主线")m.main=v; else if(k==="由主线演化出来的")m.evolved=sp(v);
  else if(k==="支线")m.branches=sp(v);
  if(JSON.stringify([pj.goal,pj.reward,pj.reality,d.what,d.reality,d.evidence,m.main,m.evolved,m.branches])!==before)
    saveProject(id,`修改${k}：${pj.name}`);
},true);
function saveNode(pid,nid){
  const n=(D.p[pid].project.sop?.nodes||[]).find(x=>x.id===nid);if(!n) return;
  n.whole=$("#n_whole").value.trim();n.concl=$("#n_concl").value.trim();
  n.so=$("#n_so").value.trim();n.judge=$("#n_judge").value.trim();
  (n.how||[]).forEach((h,i)=>{const el=$("#n_h"+i);if(el)h.t=el.value.trim()});
  (n.pains||[]).forEach((p,i)=>{
    const v=($("#n_p"+i)?.value||"").trim(),sol=$("#n_s"+i)?.checked;
    p.solved=!!sol; if(sol){p.fix=v;delete p.gap}else{p.gap=v;delete p.fix}
  });
  return saveProject(pid,`修改 SOP 节点：${n.name}`);
}
function addMethod(){
  const arr=D.meth.methods=D.meth.methods||[];
  let n=1;while(arr.some(m=>m.id==="m-"+String(n).padStart(3,"0"))) n++;
  const t=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const m={id:"m-"+String(n).padStart(3,"0"),cat:(D.meth.cats||[])[0]||"每天怎么跑",
           proj:cur(),projName:D.p[cur()]?.project?.name||"",
           name:"新方法",when:"",what:"",src:(+t.slice(5,7))+"/"+(+t.slice(8,10)),refs:[t]};
  arr.push(m);S.edit=true;go("method",m.id);
}
function saveMethod(id){
  const m=findM(id);if(!m) return;
  m.name=$("#m_name").value.trim()||"未命名";
  m.what=$("#m_what").value.trim();
  m.when=$("#m_when").value.trim();
  m.src=$("#m_src").value.trim();
  m.refs=[...new Set((m.src.match(/(\d{1,2})\/(\d{1,2})/g)||[]).map(t=>{
    const [a,b]=t.split("/");return `2026-${String(+a).padStart(2,"0")}-${String(+b).padStart(2,"0")}`}))];
  S.edit=false;
  return saveMethods(`方法：${m.name}`);
}
async function delMethod(id){
  if(!confirmDel){confirmDel=true;toast("再点一次「删除这条方法」才真的删");setTimeout(()=>confirmDel=false,4000);return}
  confirmDel=false;
  const arr=D.meth.methods,i=arr.findIndex(m=>m.id===id);if(i<0) return;
  const [m]=arr.splice(i,1);
  try{await put("methods.json",D.meth,`删除方法：${m.name}`);S.edit=false;toast("已删除");tab("meth")}
  catch(e){arr.splice(i,0,m);toast("删除失败："+e.message)}
}
async function decide(id,i,opt){
  const P=D.p[id];const g=P.iteration.gates[i];
  g.decision={option:opt,reason:($("#reason"+i)?.value||"").trim(),at:new Date().toISOString()};
  try{await put(`projects/${id}/iteration.json`,P.iteration,`Human Gate：${g.title} → ${opt}`);toast("已记录你的决定");render()}
  catch(e){toast("保存失败："+e.message)}
}
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-stop]")&&!e.target.closest("[data-pick]")) return;
  const t=e.target.closest("[data-go],[data-back],[data-tab],[data-sheet],[data-closesheet],[data-pick],[data-open],[data-toggle],[data-edit],[data-canceledit],[data-decide],[data-savecfg],[data-reload],[data-savenode],[data-saveboard],[data-zoom],[data-node],[data-filter],[data-savepri],[data-addrow],[data-tofilter],[data-setst],[data-delrow],[data-setreal],[data-addm],[data-savem],[data-delm],[data-setcat],[data-mproj],[data-reanalyze]");
  if(!t) return;const d=t.dataset;
  if(d.reanalyze) return reanalyze(d.reanalyze);
  if("addm" in d) return addMethod();
  if(d.savem) return saveMethod(d.savem);
  if(d.delm) return delMethod(d.delm);
  if(d.setcat){const [id,c]=d.setcat.split("|");const m=findM(id);if(m){m.cat=c;render()}return}
  if(d.mproj!=null){S.mproj=d.mproj||"";return render()}
  if(d.zoom){ZOOM=d.zoom==="fit"?1:(d.zoom==="+"?Math.min(3,ZOOM*1.3):Math.max(.6,ZOOM/1.3));return fitBoard()}
  if(d.node) return go("node",(S.arg||cur())+"|"+d.node);
  if(d.filter!=null){S.filter=S.filter===d.filter?null:d.filter;return render()}
  if(d.tofilter){const [pid,k]=d.tofilter.split("|");S.filter=k;return go("list",pid)}
  if(d.savepri){S.priDirty=false;return saveRows(d.savepri,"更新优先程度",true)}
  if(d.setst){const [i,st]=d.setst.split("|");return setStatus(+i,st)}
  if(d.setreal){const [i,v]=d.setreal.split("|");const P=D.p[cur()],r=P.rows[+i];
    r.cols=r.cols||{};r.cols[REALC]=r.cols[REALC]===v?"":v;render();
    return saveRows(cur(),`碰现实了吗：${r.cols[REALC]||"清空"}`)}
  if(d.delrow!=null) return delRow(+d.delrow);
  if("addrow" in d){
    const id=S.arg||cur(),P=D.p[id],c={};(P.project.columns||[]).forEach(k=>c[k]="");
    P.rows.push({date:new Date().toISOString().slice(0,10),f:"待改",q:"",cols:c,night:null});
    return go("row",P.rows[P.rows.length-1].date+"|"+(P.rows.length-1));
  }
  if(d.go){if((d.go==="project"||d.go==="iter")&&!d.arg){go(d.go,cur())}else go(d.go,d.arg);return}
  if("back" in d) return back();
  if(d.tab) return tab(d.tab);
  if("sheet" in d){S.sheet=true;return render()}
  if("closesheet" in d){S.sheet=false;return render()}
  if(d.pick) return pick(d.pick);
  if(d.open){try{await loadProject(d.open)}catch(err){return toast(err.message)}return go(d.target,d.open)}
  if(d.toggle){S.open[d.toggle]=!S.open[d.toggle];return render()}
  if("edit" in d){S.edit=true;return render()}
  if("canceledit" in d){S.edit=false;return render()}
  if(d.savenode){const [pid,nid]=d.savenode.split("|");return saveNode(pid,nid)}
  if("saveboard" in d) return saveProject(S.arg||cur(),"调整 SOP 图的节点位置");
  if(d.decide){const [id,i,o]=d.decide.split("|");return decide(id,+i,o)}
  if("savecfg" in d){cfg.owner=$("#owner").value.trim();cfg.repo=$("#repo").value.trim();cfg.token=$("#token").value.trim();saveCfg();S.screen="today";return loadAll()}
  if("reload" in d){D.p={};return loadAll()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".tap")) e.target.click()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cfg.token){D.p={};loadAll()}});
render(); if(cfg.token) loadAll();
</script>
</body>
</html>
