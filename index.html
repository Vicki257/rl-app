<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天">
<meta name="theme-color" content="#0D0D0C">
<title>强化学习系统</title>
<!-- build 2026-09-23i -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0D0D0C; --paper:#1A1A17; --ink:#F3EFE6; --ink2:#D9D4C8; --ink3:#9D9589;
  --line:#302F29; --soft:#232219; --accent:#E5C463; --accentSoft:#3B3218; --bad:#E88E74; --badSoft:#3A2318; --onAccent:#12110F;
  --glow:#2A2416; --navbg:rgba(13,13,12,.96); --qink:#FFF6E6; --phink:#5B554A; --dot:#312C25;
  --fnline:#4A4636; --inth:#211F1C; --fx:#8FB489; --kdp:#8FB3D9; --edge:#8A7B58; --pin:#514A3F;
  --wn:#D9A566; --wnbg:rgba(217,165,102,.075); --wnline:rgba(217,165,102,.5);
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC",serif;
  --read:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;  /* 正文（人写的和 AI 写的）统一用这个 */ --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

/* 白天版。只改颜色变量，版式和夜间完全一样 */
html[data-theme="light"]{
  --ground:#F6F4EF; --paper:#FFFFFF; --ink:#1A1916; --ink2:#3A362E; --ink3:#78705F;
  --line:#E3DED1; --soft:#F2EFE7; --accent:#8A6D12; --accentSoft:#F5EBC9; --bad:#A8411F; --badSoft:#FBE7DF; --onAccent:#FFFFFF;
  --glow:#EFE7D2; --navbg:rgba(246,244,239,.96); --qink:#1A1916; --phink:#A9A294; --dot:#E0DACA;
  --fnline:#DDD6C6; --inth:#EDE9DF; --fx:#3C7A33; --kdp:#2B6397; --edge:#A3927066; --pin:#A9A294;
  --wn:#8A5A12; --wnbg:rgba(180,130,30,.10); --wnline:rgba(160,110,20,.45);
}
html[data-theme="light"] .nd.drag{box-shadow:0 8px 20px rgba(0,0,0,.12)}
html[data-theme="light"] .sheet{background:rgba(0,0,0,.28)}

/* 正文统一：凡是「内容」——我写的、AI 写的——都用 --read，界面文字（按钮、标签、导航、元信息）才用 sans。
   这样一页里不会出现三四种字体。公式和手算还是等宽，那是它该用的。 */
.kv .v,.line3 .txt,.sub,.evi,.dtl,.pain p,.recall .w,.how,.judge,.q,.sop .tx,.nd .q,.fn .q,
.tbl td,.cmp td,.banner,.prev,textarea,input,.srch{font-family:var(--read);font-weight:600}
.tbl th,.cmp th{font-family:var(--sans)}
.sop .mono,.meta,.zc .z,.step .n{font-family:var(--mono)}
.nd .t,.fn .t,.sop .sn i{font-family:var(--sans)}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden}
body{overflow-x:hidden}
body{margin:0;background:radial-gradient(130% 42% at 50% 0%,var(--glow) 0%,var(--ground) 62%) fixed,var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;overflow-x:hidden}
.body{flex:1;min-width:0;max-width:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px;display:flex;flex-direction:column;gap:12px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--navbg);backdrop-filter:blur(10px);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.nav button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink3);padding:6px 0;cursor:pointer}
.nav button[aria-current="true"]{color:var(--accent);font-weight:700}
button{font:inherit}
button:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.back{font-size:16px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.h1{font-family:var(--serif);font-size:27px;font-weight:900;margin:0}
.h2{font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin:6px 0 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.chev{margin-left:auto;color:var(--ink3);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:2px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:15.5px;background:none;border:0;border-radius:9px;padding:9px 0;cursor:pointer;color:var(--ink3)}
.seg button.on{background:var(--paper);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.meta{font-size:13px;color:var(--ink3);font-family:var(--mono)}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.ok{background:var(--accentSoft);color:var(--accent)} .bd{background:var(--badSoft);color:var(--bad)}
.q{font-family:var(--serif);color:var(--qink);font-size:21px;font-weight:700;line-height:1.45;margin:0;text-wrap:balance}
.lbl{font-size:13.5px;color:var(--accent);font-weight:700;width:38px;flex:none}
.line3{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.65}
.line3:first-child{border-top:0}
.line3 .txt{flex:1;min-width:0}
.btn{font-weight:700;font-size:16.5px;background:var(--accent);color:var(--onAccent);border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15.5px;padding:12px}
.btn:disabled{opacity:.5}
.banner{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.small{font-size:14px;color:var(--ink2);line-height:1.6}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:14px}
.tbl table{border-collapse:collapse;font-size:14px;min-width:620px;width:100%}
.tbl table.mq,.tbl table.fx,.tbl.in table{table-layout:fixed}
.tbl table.mq td,.tbl table.mq th,.tbl table.fx td,.tbl table.fx th,.tbl.in td,.tbl.in th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl table.mq tr.sub>td,.tbl table.fx tr.sub>td,.tbl.in tr.sub>td{overflow:visible;white-space:normal}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl th{color:var(--ink3);background:var(--soft);white-space:nowrap}
.tbl tr.sel td{background:var(--accentSoft)}
.tbl tbody tr{cursor:pointer}
.kv{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13.5px;color:var(--accent);font-weight:700}
.kv .v{font-size:16px;line-height:1.7;white-space:pre-wrap}
.kv,.card,.fld{min-width:0}
.raw-field{display:block;width:100%;min-width:0;max-width:100%;border:0;resize:vertical;background:transparent;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7;padding:6px 0;field-sizing:content;min-height:2em}
.raw-field:focus{outline:1px solid var(--accent);outline-offset:2px}
.raw-preview,.raw-prose{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.raw-code,.kv .v.raw-code{box-sizing:border-box;display:block;width:100%;max-width:100%;min-width:0;margin:8px 0;padding:12px 14px;border-radius:10px;background:#181818;color:#e1e1e1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;font-weight:400;font-size:14px;line-height:1.55;white-space:pre;overflow-x:auto;overflow-wrap:normal;word-break:normal;tab-size:4;font-variant-ligatures:none;-webkit-overflow-scrolling:touch}
.raw-code code{font:inherit;white-space:inherit}
.raw-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.raw-tools button{font-size:12px}
.raw-field[hidden],.raw-preview[hidden]{display:none!important}
.kv textarea.raw-field:not(.raw-code){white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--read);font-weight:600}
.kv textarea.raw-field{max-height:none;min-height:3em}
.step{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:16px;cursor:pointer}
.step .n{font-family:var(--mono);width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11px;flex:none}
.arrow{padding-left:5px;color:var(--accent);opacity:.6;font-size:14px}
.sub{margin:2px 0 6px 30px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap}
.recall{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.recall:first-child{border-top:0}
.recall .t{font-weight:700;font-size:16px}
.recall .w{font-size:15px;color:var(--ink2);line-height:1.6}
.tag{font-size:12.5px;font-weight:700;color:var(--accent)}
.evi{margin-top:8px;padding:12px;background:var(--soft);border-radius:10px;font-size:14.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap}
.cmp{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.cmp td,.cmp th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--ink3);font-size:12.5px}
textarea,input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.6}
textarea{min-height:70px;resize:vertical}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .in{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--onAccent);font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px;z-index:9;max-width:90%;text-align:center}
.ed{border-radius:8px;padding:3px 7px;margin:0 -7px;min-height:1.7em;transition:background .15s}
.ed:hover{background:var(--soft)}
.ed:focus{outline:none;background:var(--soft);box-shadow:0 0 0 1px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:var(--phink)}
.prev{color:var(--ink3);font-size:14.5px;line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pw{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.pw .pin{width:44px}
.fold{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:15.5px}
.fold.sm{font-size:15px;padding:10px 0}
.fold.sm .meta{margin-left:auto}
.mg{border-top:1px solid var(--soft)}
.mg:first-child{border-top:0}
.mg .line3{padding-left:10px;font-size:15px}
.srch{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);margin-bottom:10px;-webkit-appearance:none}
.srch:focus{outline:none;border-color:var(--accent)}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.add{color:var(--ink3);font-weight:400;padding:7px 16px}
.tbl.sm table{min-width:0}
.tbl.rtb table{min-width:586px;table-layout:fixed}
.tbl.rtb td{white-space:nowrap}
.ogp+.ogp{border-top:1px solid var(--line)}
.rdt{white-space:pre-wrap;line-height:1.8;color:var(--ink2);padding:2px 0 4px}
.ogp .line3[data-ogp]{font-weight:700}
.ovs{padding:14px 0;border-bottom:1px solid var(--line)}
.ovs:first-child{padding-top:2px}
.ovs:last-child{border-bottom:0;padding-bottom:2px}
.ovt{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.ovt i{font-style:normal;color:var(--accent);font-family:var(--mono);margin-right:8px}
.ovb{font-family:var(--read);font-weight:600;font-size:15px;line-height:1.75;color:var(--ink2);white-space:pre-wrap}
.ovl{margin:4px 0 0;padding-left:0;list-style:none;counter-reset:ov}
.ovl li{counter-increment:ov;font-family:var(--read);font-weight:600;font-size:15px;line-height:1.7;padding:6px 0 6px 28px;position:relative}
.ovl li:before{content:counter(ov);position:absolute;left:0;top:6px;color:var(--ink3);font-family:var(--mono);font-size:13px}
.tbl.sm th{white-space:normal}
.coc{cursor:pointer}
.pill.soft{background:var(--soft);color:var(--ink3)}
.tag.m{color:var(--ink);background:var(--accentSoft);border-radius:5px;padding:2px 7px}
.how{margin-top:8px;padding:11px 12px;background:var(--accentSoft);border-radius:10px;font-size:15px;line-height:1.65;color:var(--ink2)}
.how b{display:block;color:var(--accent);font-size:13px;margin-bottom:3px}
.btn.ghost.bd{color:var(--bad);border-color:var(--bad)}
.center{display:grid;place-items:center;min-height:60vh;color:var(--ink3);font-size:16px}
.sop-prompt{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.sop-prompt summary{cursor:pointer;font-weight:700;color:var(--ink)}
.sop-prompt .prompt-text{margin-top:12px;font-family:var(--read);font-size:14px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
/* SOP 白板 */
.board{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:20px 20px}
.board.zoom{overflow:auto}
.cvs{position:relative;width:1100px;height:860px;transform-origin:0 0}
.zc{display:flex;gap:6px;align-items:center;margin-top:8px}
.zc button{font:inherit;font-size:13.5px;background:var(--paper);border:1px solid var(--line);color:var(--ink3);border-radius:999px;padding:4px 12px;cursor:pointer}
.zc .z{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:4px}
.flow{display:none;margin-top:10px}
.fl{display:flex;gap:8px;justify-content:center}
.fn{flex:1;min-width:0;background:var(--soft);border:1px solid var(--fnline);border-radius:11px;padding:13px 12px;cursor:pointer}
.fn.plain{border-style:dashed;background:transparent;cursor:default;text-align:center}
.fn .t{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;gap:4px}
.fn.plain .t{color:var(--ink);justify-content:center}
.fn .q{color:var(--ink2);font-size:12.5px;line-height:1.5;margin-top:3px}
.fa{text-align:center;color:var(--accent);opacity:.65;font-size:15px;line-height:1;padding:8px 0}
.fp{font:inherit;font-size:14px;color:var(--ink3);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.fp b{color:var(--ink);margin-right:6px;font-weight:700}
.fp.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.fp.on b{color:var(--accent)}
.pin{width:40px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--accent);font:13px var(--mono);text-align:center;padding:4px 0}
.pin:focus{outline:none;border-color:var(--accent);background:var(--soft)}
.pin::placeholder{color:var(--pin)}
.tbl td .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.nowrap td{height:44px;vertical-align:middle;padding:0 10px}
@media(max-width:700px){.board,.zc{display:none}.flow{display:block}}
/* 宽屏统一栅格。整个 app 手机优先是一根 560px 窄栏，电脑上等于白看；
   但只把 SOP 那一张卡单独撑开会一大一小，所以宽屏时整根栏子一起变宽，
   所有卡片同宽、左右对齐同一条线。正文另外限宽，免得一行八十个字。 */
/* 主线问题两层表 */
.tbl table.mq{min-width:700px}.tbl.in table{min-width:840px}
tr.bg{cursor:pointer}tr.bg:hover>td{background:var(--accentSoft)}
.tbl td.bt{font-size:15.5px;font-weight:700;color:var(--ink);min-width:260px}
.tbl td.bt .tri{display:inline-block;color:var(--accent);font-size:9px;width:17px;transition:transform .15s}
tr.bg.on td.bt .tri{transform:rotate(90deg)}
.bar{display:inline-flex;gap:3px;vertical-align:middle}
.bar i{width:10px;height:13px;border-radius:2px;background:var(--line);display:block}
.bar i.f{background:var(--accent)}
.tbl .red{color:var(--bad);background:none}
.tbl .meta.kbd{color:var(--bad);background:none;font-weight:700}
.tbl .meta.kok{color:var(--accent);font-weight:700}
.tbl .meta.kdp{color:var(--kdp);font-weight:700}
tr.sub>td{padding:0 0 12px 30px !important;height:auto;background:var(--ground);white-space:normal;overflow:visible}
.judge{font-size:14px;color:var(--ink2);padding:11px 2px 10px;line-height:1.6}
.dtl{font-size:14.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;padding:12px 14px;background:var(--soft)}
.tbl.in{background:var(--soft)}.tbl.in th{background:var(--inth)}
.tbl td.pri{text-align:center;position:relative}
.tbl td.pri .td{display:block;font-size:10px;color:var(--accent);line-height:1;margin-top:-3px}
tr.k.hot>td{background:var(--accentSoft)}
.tbl td.cv{color:var(--ink3);text-align:center}
.tbl .cell.dim{color:var(--ink2)}
tr.add>td{color:var(--accent);cursor:pointer;border-bottom:0}
tr.add:hover>td{background:var(--accentSoft)}
@media(min-width:701px){
  #app{max-width:min(1080px,100vw - 48px)}
  .body{padding-left:28px;padding-right:28px;gap:14px}
  .h1{font-size:31px}
  /* 纯文字不跟着拉满：表格、白板、公式块不在此列，它们要多宽有多宽 */
  .kv .v,.sop .tx,.sop .wn,.sop .mono{max-width:820px}
  /* 满宽 1024px 的按钮又长又丑，收窄但仍从同一条左线起 */
  .body>.btn{max-width:420px}
  .sheet .in{max-width:680px}
}
.cvs svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nd{position:absolute;width:150px;line-height:1.4;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:grab;user-select:none}
.nd.plain{border-style:dashed;background:transparent}
.nd.drag{cursor:grabbing;border-color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:9}
.nd .t{font-family:var(--mono);font-size:13.5px;color:var(--accent);display:flex;justify-content:space-between;gap:6px;align-items:center}
.nd.plain .t{color:var(--ink)}
.nd .q{color:var(--ink3);font-size:12px;line-height:1.55;margin-top:4px}
/* 痛点 */
.pain{border-left:2px solid var(--accentSoft);padding-left:11px;margin:0 0 13px}
.pain.un{border-left-color:var(--line);opacity:.8}
.pain .pp{font-size:12.5px;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.pain.un .pp{color:var(--ink3)}
.pain .fx{font-size:12.5px;letter-spacing:.06em;color:var(--fx);margin:7px 0 3px}
.pain.un .fx{color:var(--ink3)}
.pain p{margin:0;font-size:16px;line-height:1.65;color:var(--ink2)}
/* SOP 一小节：小标题 + 用什么/怎么算/手算/为什么 对齐成两列 + 公式等宽 + 坑单独标。
   注意别叫 .step——那个类名在上面已经被流程行用掉了（display:flex）。 */
.sop{border-top:1px solid var(--line);padding:16px 0 4px}
.sop:first-child{border-top:0;padding-top:4px}
.sop .sn{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 11px;line-height:1.45;display:block}
.sop .sn i{font-style:normal;color:var(--accent);font-family:var(--mono);font-size:14px;letter-spacing:.03em;margin-right:8px}
.sop .f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 10px;align-items:baseline}
.sop .lb{font-size:13.5px;color:var(--accent);font-weight:700;white-space:nowrap;letter-spacing:.04em;justify-self:end;padding-top:3px}

  padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);margin:0}
/* 公式和手算占满整行——挤在右半栏的话，→ 会被折行折散，对不齐就看不懂了 */
.sop .f>.fw{grid-column:1/-1}
.sop .f>.lbf{grid-column:1/-1;justify-self:start;padding-top:2px}
.sop .wn{margin-top:11px;font-size:15.5px;line-height:1.7;color:var(--wn);background:var(--wnbg);
  border-left:2px solid var(--wnline);border-radius:0 8px 8px 0;padding:9px 12px;white-space:pre-wrap}

.whole{font-size:17px;line-height:1.7;color:var(--accent);margin:12px 0 14px;padding-left:11px;border-left:2px solid var(--accentSoft)}

/* ---- 认知树 ---- */
.tree{margin:2px 0 14px}

.tlegend .done{color:var(--fx)}.tlegend .active{color:var(--accent)}

<body>
<div id="app"></div>
<script>
/* ============ 配置与 GitHub 读写 ============ */
const LS="rl.cfg";
const cfg=(()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}})();
const THK="rl.theme";
function theme(){try{return localStorage.getItem(THK)||"auto"}catch(e){return "auto"}}
function applyTheme(t){
  try{localStorage.setItem(THK,t)}catch(e){}
  const light = t==="light" || (t==="auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.setAttribute("data-theme",light?"light":"dark");
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",light?"#F6F4EF":"#0D0D0C");
}
try{window.matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(theme()==="auto")applyTheme("auto")})}catch(e){}
applyTheme(theme());
function saveCfg(){try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}}
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const SHA={},BASE={},READ={}; // 已确认的来源、文件 SHA 或精确 404，绝不把网络错误当空文件
const copyJSON=v=>JSON.parse(JSON.stringify(v));
function withoutUid(v){
  if(Array.isArray(v))return v.map(withoutUid);
  if(v&&typeof v==="object")return Object.fromEntries(
    Object.entries(v).filter(([k])=>k!=="uid").map(([k,x])=>[k,withoutUid(x)]));
  return v;
}
// 只合并 GitHub Actions 新增的 UID；结构变化时宁可拒绝，也不按位置猜编号。
function applyRemoteUid(before,local,remote){
  const pending=[];
  const same=(a,b)=>JSON.stringify(withoutUid(a))===JSON.stringify(withoutUid(b));
  function inspect(base,draft,current){
    if(Array.isArray(base)){
      // 允许尾部新增；服务端列表必须仍和 BASE 同长，否则不是单纯的补号。
      if(!Array.isArray(draft)||!Array.isArray(current)||
         draft.length<base.length||current.length!==base.length)
        throw new Error("数据结构已经变化，请刷新后重试，未覆盖远端数据");
      // 无稳定键的列表不可随意重排；能识别的换位直接拒绝，防止 UID 错配。
      // 只有原有前缀未被改动时才认定为尾部追加；防止插在开头时 UID 错配。
      if(draft.length>base.length&&base.some((x,i)=>!same(x,draft[i])))
        throw new Error("记录不是安全的尾部追加，请刷新后重试，未覆盖远端数据");
      for(let i=0;i<base.length;i++)
        if(!same(base[i],draft[i])&&
           draft.slice(0,base.length).some((x,j)=>j!==i&&same(base[i],x)))
          throw new Error("记录顺序已经变化，请刷新后重试，未覆盖远端数据");
      // 持久化列表的原有元素不能就地重排/替换；新增只允许安全尾部追加。
      // 远端刚补 UID 时，若原元素没有 UID 且没有唯一 id/date，内容改动后身份无法证明：
      // 即使两行 date 相同且两行同时被修改，也必须拒绝，不能错配永久身份。
      for(let i=0;i<base.length;i++){
        const original=base[i],changed=draft[i],latest=current[i];
        if(!original||typeof original!=="object"||Array.isArray(original)||
           original.uid!=null||!latest||latest.uid==null)continue;
        const uniqueField=k=>original[k]!=null&&changed&&changed[k]===original[k]&&
          base.filter(v=>v&&v[k]===original[k]).length===1;
        if(!uniqueField("id")&&!uniqueField("date")&&!same(original,changed))
          throw new Error("无法确认旧记录的永久身份，请刷新后重试，未覆盖远端数据");
      }
      for(let i=0;i<base.length;i++)inspect(base[i],draft[i],current[i]);
    }else if(base&&typeof base==="object"){
      if(!draft||typeof draft!=="object"||Array.isArray(draft)||
         !current||typeof current!=="object"||Array.isArray(current))
        throw new Error("数据结构已经变化，请刷新后重试，未覆盖远端数据");
      for(const k of ["uid","id","date"])
        if(base[k]!=null&&draft[k]!=null&&base[k]!==draft[k])
          throw new Error("记录身份已变化，请刷新后重试，未覆盖远端数据");
      if(current.uid!=null){
        if(draft.uid!=null&&draft.uid!==current.uid)
          throw new Error("永久编号存在冲突，已阻止覆盖");
        pending.push([draft,current.uid]);
      }
      for(const k of Object.keys(base))
        if(k!=="uid"&&k in draft&&k in current)inspect(base[k],draft[k],current[k]);
    }
  }
  inspect(before,local,remote);
  // 全部身份核验通过后才修改内存，避免中途报错留下半合并状态。
  for(const [obj,uid] of pending)obj.uid=uid;
}
// 开发版未指定数据分支只读；部署在 main 的正式版保持原实现不受影响。
// 旧正式版在官方 GitHub Pages 留空分支时仍读取 main；其他预览/开发页面禁止默认写入。
function officialApp(){
  return typeof location!=="undefined"&&location.hostname.toLowerCase()==="vicki257.github.io"&&
    /^\/rl-app\/?(?:index\.html)?$/.test(location.pathname);
}
function branch(){
  return (cfg.branch||"").trim()||(officialApp()?"main":"");
}
const sourceKey=()=>[cfg.owner||"",cfg.repo||"",branch()].join("|");
let cacheSource=null;
let branchOK=null,checkedSource=null;    // 每个数据源分别验证，旧请求不能授权新分支
async function ensureBranch(){
  const b=branch(),origin=sourceKey();
  if(!b) throw new Error("开发版未指定数据分支，禁止写入默认分支");
  if(b==="main"&&!officialApp())throw new Error("开发预览只可读取 main，不能写入正式分支");
  if(checkedSource===origin&&branchOK===true)return true;
  if(checkedSource===origin&&typeof branchOK==="string")throw new Error(branchOK);
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/branches/${encodeURIComponent(b)}`,
    {headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(origin!==sourceKey())throw new Error("验证分支期间数据源已切换，请重新读取");
  checkedSource=origin;
  if(!r.ok){branchOK=`分支 ${b} 在 ${cfg.owner}/${cfg.repo} 上不存在（${r.status}），没有写任何东西`;throw new Error(branchOK)}
  branchOK=true;return true;
}
async function gh(path,opt={}){
  const b=branch();
  const q=b&&(!opt.method||opt.method==="GET")?`?ref=${encodeURIComponent(b)}`:"";
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data/${path}${q}`,{...opt,headers:{Authorization:`Bearer ${cfg.token}`,Accept:"application/vnd.github+json",...(opt.headers||{})},cache:"no-store"});
  if(!r.ok){const t=await r.text();const e=new Error(`${r.status} ${path}：${t.slice(0,120)}`);e.status=r.status;throw e}
  return r.json();
}
async function get(path){
  const source=sourceKey();
  if(cacheSource!==null&&cacheSource!==source){
    for(const bag of [SHA,BASE,READ])Object.keys(bag).forEach(k=>delete bag[k]);
  }
  cacheSource=source;
  // 新一次读取失败即撤销该文件的写入资格；旧 SHA 不能继续使用。
  delete READ[path];delete SHA[path];delete BASE[path];
  const j=await gh(path),v=JSON.parse(b64d(j.content));
  if(source!==sourceKey())throw new Error("仓库或分支已切换，请重新加载");
  if(!j.sha||!j.content)throw new Error("缺少 GitHub 文件 SHA 或内容："+path);
  SHA[path]=j.sha;BASE[path]=copyJSON(v);READ[path]={source,sha:j.sha,exists:true};
  return v;
}
async function getOptional(path,missingValue){
  try{return await get(path)}
  catch(e){
    // 只有 GitHub contents API 明确 404 才确认为不存在，拒绝把 401/403/网络故障当空文件。
    if(e.status!==404)throw e;
    READ[path]={source:sourceKey(),sha:null,exists:false};
    return copyJSON(missingValue);
  }
}
const writing=new Set();
async function put(path,obj,msg,options={}){
  const key=JSON.stringify([sourceKey(),path]);
  if(writing.has(key))throw new Error("上一笔保存尚未完成，请重试："+path);
  writing.add(key);
  try{return await putOnce(path,obj,msg,options)}
  finally{writing.delete(key)}
}
async function putOnce(path,obj,msg,options){
  const source=sourceKey(),readBefore=READ[path];
  if(cacheSource!==null&&cacheSource!==source)throw new Error("数据源已切换，请先重新读取新分支");
  cacheSource=source;
  const guard=()=>{if(source!==sourceKey())throw new Error("数据源已切换，禁止使用旧文件 SHA")};
  const message=msg||`更新 ${path}`;
  async function send(sha){
    guard();
    // 缓存必须记录实际发送的快照，而不是等待响应时仍可被界面修改的对象。
    const content=JSON.stringify(obj,null,2)+"\n";
    const body={message,content:b64e(content),branch:branch()};
    if(sha)body.sha=sha;
    const j=await gh(path,{method:"PUT",body:JSON.stringify(body)});guard();
    SHA[path]=j.content.sha;BASE[path]=JSON.parse(content);
    READ[path]={source,sha:j.content.sha,exists:true};
  }
  await ensureBranch();guard();
  if(READ[path]!==readBefore)throw new Error("保存期间文件已重新读取，请重试："+path);
  let read=readBefore;
  // 首次创建必须有调用方明确授权，并再次确认文件确实不存在。
  if(!read&&options.create){
    try{await get(path);read=READ[path]}
    catch(e){if(e.status!==404)throw e;read=READ[path]={source,sha:null,exists:false}}
  }
  if(!read||read.source!==source||read.exists&&(!read.sha||read.sha!==SHA[path]))
    throw new Error("文件未成功读取或 SHA 与当前分支不一致，拒绝写入："+path);
  if(!read.exists){
    if(!options.create)throw new Error("未确认创建新文件，禁止写入："+path);
    // 精确 404 已确认；不带 sha 的首次创建只允许在这里。
    try{
      await send();return;
    }catch(err){
      if(err.status===409||err.status===422)
        throw new Error("该文件已被其他会话创建，请刷新后再试，未覆盖远端数据");
      throw err;
    }
  }
  try{
    await send(read.sha);return;
  }catch(e){
    const m=String(e.message);
    if(!m.startsWith("422")&&!m.startsWith("409"))throw e;
  }
  // 远端有新内容时禁止陈旧整文件覆盖；只有补发 UID 可按相同对象合并。
  const latest=await gh(path);guard();const server=JSON.parse(b64d(latest.content));
  if(READ[path]!==read||!BASE[path]||JSON.stringify(withoutUid(BASE[path]))!==JSON.stringify(withoutUid(server)))
    throw new Error("数据已在别处更新，请刷新后重试；本次未覆盖远端数据");
  applyRemoteUid(BASE[path],obj,server);
  try{
    await send(latest.sha);
  }catch(e){
    const m=String(e.message);
    if(m.startsWith("422")||m.startsWith("409"))
      throw new Error("保存期间又有新的修改，请刷新后重试；本次未覆盖远端数据");
    throw e;
  }
}

/* ============ 状态 ============ */
const D={global:null,index:[],status:null,p:{},meth:null};
const S={screen:"today",arg:null,stack:[],open:{},sheet:false,edit:false,loading:true,err:"",toast:"",ost:"待改",og:{},relPick:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>D.global?.current;
async function loadProject(id,force,quiet){
  if(D.p[id]&&!force) return D.p[id];
  const [project,rows,current,iteration]=await Promise.all(["project","rows","current","iteration"].map(n=>get(`projects/${id}/${n}.json`)));
  D.p[id]={project,rows,current,iteration};
  // 老版本只存了日期和正文：仅在唯一匹配且有真实 UID 时补写，不依据 idx 猜。
  if(!quiet&&!current.focus?.focusUid&&current.focus?.date&&current.focus?.q){
    const matches=rows.filter(r=>r.date===current.focus.date&&r.q===current.focus.q&&r.uid);
    if(matches.length===1){
      const upgraded=copyJSON(current);upgraded.focus.focusUid=matches[0].uid;
      try{await put(`projects/${id}/current.json`,upgraded,"迁移旧当前焦点到永久 UID");
        D.p[id].current=upgraded}
      catch(e){S.focusWarning="旧焦点迁移失败，请手动选择："+e.message}
    }else S.focusWarning="旧焦点没有唯一 UID 匹配，请重新选择";
  }
  // 同一条 syncPending 必须等待一次恢复完成，不能同时启动两个写入流程。
  if(PendingFocus(id)){
    try{await finishFocusSync(id)}
    catch(e){S.focusWarning="焦点同步未完成："+e.message}
  }
  if(quiet)return D.p[id];                  // 后台仅恢复明确遗留的 pending
  if(!PendingFocus(id))syncFocus(id).catch(()=>{});
  return D.p[id];
}
async function loadAll(){
  S.loading=true;S.err="";S.focusWarning="";render();
  try{
    // 方法、历史与项目数据属于必读原件：读取失败就报错，不允许伪装成空数据。
    // 本轮新增的 cogtree / rels 用 getOptional：只有确认的 404 才降级，
    // 这样合并顺序不会让正式版整个打不开。
    const settled=await Promise.allSettled([
      get("global.json"),get("projects/index.json"),getOptional("status.json",null),
      get("methods.json"),
      // cogtree / rels 是本轮新增的两张表，仓库里可能还没有（例如 app 先合进 main、
      // 数据还没合，或者有人把分支指到旧提交）。缺它们只该让认知树降级，
      // 不该让整个 app 打不开。getOptional 只认「确认的 404」，
      // 401/403/网络故障照旧抛错，「读取失败不得当成空数据」这条没有放松。
      getOptional("cogtree.json",{up:{},struct:{roots:[],nodes:{}},hideProjects:["journal"]}),
      getOptional("rels.json",{rels:[],chains:[]}),get("history.json"),
      getOptional("cognotes.json",{}),get("widget.json")]);
    const error=settled.find(x=>x.status==="rejected");
    if(error)throw error.reason;
    [D.global,D.index,D.status,D.meth,D.cogtree,D.rels,D.hist,D.notes,D.widget]=settled.map(x=>x.value);
    await loadProject(cur(),true);
    const active=D.p[cur()];
    if(active&&!PendingFocus(cur())&&D.widget?.focusUid&&D.widget.focusUid!==active.current?.focus?.focusUid)
      S.focusWarning="Today 和小组件当前认知不一致，请重新选择今日焦点";
  }catch(e){
    // 等全部读取完成后统一撤销写入资格，旧内存无法再保存。
    for(const bag of [SHA,BASE,READ])Object.keys(bag).forEach(k=>delete bag[k]);
    D.p={};D.global=null;D.index=[];D.status=null;D.meth=null;D.cogtree=null;
    D.rels=null;D.hist=null;D.notes=null;D.widget=null;treeDirty();
    S.err="数据加载失败（禁止写入未加载文件）："+e.message;
  }
  S.loading=false;render();
  // 「所有未解决问题」要跨项目，所以首屏之后把其余项目也读进来；只读，不动它们的 current.json
  (D.index||[]).filter(x=>x.state!=="archived"&&x.id!==cur())
    .forEach(x=>loadProject(x.id,false,true).then(()=>render()).catch(()=>{}));
}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast="";const el=document.querySelector(".toast");if(el)el.remove();else render()},2200)}

/* ============ 工具 ============ */
function rel(iso){if(!iso)return"";const d=(Date.now()-new Date(iso))/864e5;if(d<1)return"今天";return Math.floor(d)+"天前"}
function nightState(c){
  const n=c.night||{};
  if(n.status==="done") return "done";
  if(n.status==="fail") return "fail";
  if(n.deadline&&Date.now()>new Date(n.deadline)) return "fail";
  return n.status||"wait";
}
// 写入新问题后，分析要在下一个早上 8:00（日本时间）之前跑出来；过了就算没跑成
function next8(){const d=new Date();const jst=new Date(d.getTime()+9*36e5);if(jst.getUTCHours()>=8)jst.setUTCDate(jst.getUTCDate()+1);jst.setUTCHours(8,0,0,0);return new Date(jst.getTime()-9*36e5).toISOString()}
function curRow(P){return P.rows.find(r=>r.date===P.current.rowDate)||P.rows[P.rows.length-1]}
function widgetFrom(id,P){
  const row=focusRowOf(P),n=row?.night||{};
  const isList=!!P.project.labels;
  if(!row?.uid)throw new Error("当前认知 UID 无效，拒绝更新小组件");
  return {project:id,name:P.project.name,focusUid:row.uid,
    q:row.q,
    writtenAt:P.current.writtenAt,
    night:{status:P.current.night?.status==="done"&&!n.c?"skip":P.current.night?.status||"wait",deadline:P.current.night?.deadline||null,error:P.current.night?.error||null,
      c:n.cs||"",r:n.r||"",x:n.recall?.[0]?.t||""}};
}

/* ============ 导航 ============ */
function go(screen,arg){S.stack.push({screen:S.screen,arg:S.arg});S.screen=screen;S.arg=arg;S.open={};S.edit=false;S.colEdit=null;render();window.scrollTo(0,0)}
function back(){const b=S.stack.pop()||{screen:"today"};S.screen=b.screen;S.arg=b.arg;S.open={};S.edit=false;render()}
function tab(s){S.stack=[];S.screen=s;S.arg=null;S.open={};S.edit=false;if(s!=="tree"){S.q=""}render();window.scrollTo(0,0)}
const nav=a=>`<nav class="nav">${[["today","今天"],["plist","项目"],["tree","认知树"],["ilist","迭代"],["system","系统"]].map(([k,l])=>`<button data-tab="${k}" aria-current="${a===k}">${l}</button>`).join("")}</nav>`;
const topBar=(title,right="")=>`<div class="top"><button class="back" data-back>‹ 返回</button><span class="meta">${esc(right)}</span></div>${title?`<h2 class="h1" style="font-size:24px">${esc(title)}</h2>`:""}`;

/* ============ 页面 ============ */
function settings(){
  return `<div class="body"><h1 class="h1">连接数据</h1>
  <p class="small">数据源：${esc(cfg.owner||"未配置")}/${esc(cfg.repo||"未配置")} · ${esc(branch()||"未配置分支（只读）")}。令牌只保存在本浏览器。</p>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <label class="small" for="owner">GitHub 用户名</label><input id="owner" value="${esc(cfg.owner||"")}" autocapitalize="off">
    <label class="small" for="repo">数据仓库名</label><input id="repo" value="${esc(cfg.repo||"rl-data")}" autocapitalize="off">
    <label class="small" for="dbranch">分支（开发版必填，留空禁止写入）</label><input id="dbranch" value="${esc(cfg.branch||"")}" autocapitalize="off" placeholder="claude/loving-cerf-ufxzgm">
    <label class="small" for="token">令牌（需要该仓库 Contents 读写权限）</label><input id="token" type="password" value="${esc(cfg.token||"")}">
  </div>
  <button class="btn" data-savecfg>保存并连接</button></div>`;
}
function focusRow(P){
  if(!P.project.labels) return curRow(P);           // 每天一行的项目：当前那一行
  const open=sortRows(P.rows).filter(r=>!DONE[r.f]);   // 不管挂在哪条主线下，取优先分最高的那条
  return open[0]||sortRows(P.rows)[0]||P.rows[0];   // 清单型项目：优先分最高的未完成那一条
}
// 改了优先分或状态之后，今天页显示的那一条可能就换了人。
// 夜间分析照 current.focus 定位，所以这里必须跟着改，否则两边又会指到不同的行。
// 用户手动定过焦点就以用户的为准；没定过才回落到优先分最高的那一条
function focusRowOf(P){
  const f=P.current?.focus||{};
  if(f.focusUid)return P.rows.find(r=>r.uid===f.focusUid)||null;

    .sort((a,b)=>(priNum(b[1])-priNum(a[1]))||a[1].date.localeCompare(b[1].date));

function mainStat(P,mid){

  const wait=rs.filter(r=>!DONE[r.f]).length;
  return {n:rs.length,ev,ago:ok?days+" 天":"从没确认过",ago2:ok?days+" 天没确认":"从没确认过",agoBad:!ok||days>30,wait};

function cogProject(u){

    const pj=P.project||{},nodes=[...(pj.sop?.nodes||[])];
    for(const tk of pj.tracks||[])for(const so of tk.sops||[])nodes.push(...(so.nodes||[]));
    if((P.rows||[]).some(x=>x.uid===u)||nodes.some(x=>x.uid===u)||
       (pj.sop?.cos||[]).some(x=>x.uid===u))return pid;

  if(m)return m.proj||"通用";

function realCogUid(u){

    const pj=P.project||{};

    if((pj.sop?.nodes||[]).some(x=>x.uid===u))return true;

      if((so.nodes||[]).some(x=>x.uid===u))return true;

// SOP 和路线里的环节点（Continuity、Reflection、Compare……）有永久 UID，

function ringOf(id){
  for(const [pid,P] of Object.entries(D.p||{})){
    const pj=P.project||{};
    const all=(pj.sop?.nodes||[]).concat(...(pj.tracks||[]).map(tk=>(tk.sops||[]).flatMap(so=>so.nodes||[])));
    const n=all.find(x=>x&&x.uid===id&&x.id);

function validateRels(next){
  for(const r of next.rels||[]){
    if(!realCogUid(r.from)||!realCogUid(r.to)||r.from===r.to)
      throw new Error("关系端点不是两个不同的真实认知 UID："+r.from+" → "+r.to);
    if(!RELD[r.rel])throw new Error("未知认知关系："+r.rel);
  }
  // 已确认的有向演化关系不可形成环；候选关系不影响正式结构。
  const edges=new Map();
  for(const r of next.rels||[])if(r.state==="已确认"&&isEvo(r.rel))
    edges.set(r.from,(edges.get(r.from)||[]).concat(r.to));
  const color=new Map();
  function visit(u){
    if(color.get(u)===1)throw new Error("已确认演化关系出现环："+u);
    if(color.get(u)===2)return;
    color.set(u,1);for(const v of edges.get(u)||[])visit(v);color.set(u,2);
  }
  for(const u of edges.keys())visit(u);
  const used=new Set(),ids=new Set();
  const tree=TREE||buildTree();
  for(const c of next.chains||[]){
    if(!tree.T[c.parent]||(next.chains||[]).some(x=>x.id===c.parent))
      throw new Error("演化链归属节点不存在或指向其他链："+c.parent);
    if(realCogUid(c.id))throw new Error("链 ID 与永久认知 UID 冲突："+c.id);
    if(!/^chain-/.test(c.id))throw new Error("非法演化链 ID："+c.id);
    if(!Array.isArray(c.members)||c.members.length<2)
      throw new Error("演化链至少需要两条认知："+c.id);
    if(!c.parent)throw new Error("演化链缺少原始归属："+c.id);
    if(ids.has(c.id))throw new Error("演化链 ID 重复："+c.id);
    ids.add(c.id);
    for(const u of c.members||[]){
      if(!realCogUid(u)||used.has(u))throw new Error("演化链成员不是唯一真实 UID："+u);
      used.add(u);
    }
  }
}

function buildTree(){

    const isCog=n=>!!n.uid;

          detail:[["什么时候用",so.when||""],["版本",so.version||""]].filter(x=>x[1])});
      });

    });

    const mains=(pj.mains||[]),byMain={};
    const rest=[];

      const n=rowNode(T,add,r,i,pid);

    mains.forEach(m=>{
      const k=byMain[m.id];if(!k||!k.length)return;
      kids.push(add("main:"+pid+":"+m.id,{name:m.name,
        status:{"已闭环":"done","在验":"active","已被推翻":"failed"}[m.st]||"",
        children:k,detail:[["这条主线现在怎么样",m.judge||""],["状态",m.st||""]].filter(x=>x[1])}));
    });

  const hk=[];
  (D.hist||[]).forEach(h=>{if(!h.uid)return;

  Object.entries(CT.struct?.nodes||{}).forEach(([k,v])=>{
    (v.children||[]).forEach(c=>{if(!T[c]&&c.indexOf("proj:")===0)

    mem.forEach(u=>inChain[u]=c.id);

    if(n.chain)return;n.children=n.children.filter(c=>!inChain[c])});
  // 研究分支不是演化关系：子记录独立保存，以父认知 UID 定位。
  // 父认知进入演化链后，分支仍在该链下可见；不修改任何链成员或关系。
  const reaches=(from,to,seen=new Set())=>{

    for(const n of Object.values(T))n.children=n.children.filter(c=>c!==child);
    T[parent].children.push(child);return true;

    if(p&&p!==c.id)attach(c.id,p);
    else if(p===c.id){
      const pid=cogProject(c.parent);

  for(const [pid,P] of Object.entries(D.p||{}))for(const r of P.rows||[]){
    if(!r.uid||!r.parentUid||inChain[r.uid])continue;
    const parent=inChain[r.parentUid]||r.parentUid;

      attach(r.uid,parent); // 非法/循环引用保留原位置，不丢记录
  }

  return TREE;
}

async function saveRels(next,msg){

  try{validateRels(next);await put("rels.json",next,msg||"认知关系");
    D.rels=next;treeDirty();return true}
  catch(e){toast("没能写回仓库，这次修改没算数："+e.message);return false}

/* 合并成链：只用用户实际确认的那两个 UID，关系本身不存在链里。
   链里只有成员和名字；相邻两条之间显示什么，回 rels.json 查。 */
function mergeChain(from,to,name){
  const t=TREE||buildTree();
  const asChain=u=>chainsOf().find(c=>c.id===u)||chainOfUid(u);
  const cf=asChain(from),ct=asChain(to);
  if(cf&&ct&&cf.id===ct.id)return cf.id; // 同一条链内部增加关系，不要重复建链
  const mem=(u,c)=>c?c.members.slice():[u];
  const all=[...new Set(mem(from,cf).concat(mem(to,ct)))];
  const par=(ct||{}).parent||parentIn(t,to)||(cf||{}).parent||parentIn(t,from)||"history";
  // 旧链按它自己的 id 删掉，不管传进来的是链 id 还是链里的某个成员
  const drop=[cf&&cf.id,ct&&ct.id].filter(Boolean);
  D.rels.chains=(D.rels.chains||[]).filter(c=>!drop.includes(c.id));
  // 同一毫秒内连建两条会撞 id；刚被取代的旧链 id 也不能马上再用
  const taken=D.rels.chains.map(c=>c.id).concat(drop);
  let id="chain-"+Date.now().toString(36),k=0;
  while(taken.includes(id))id="chain-"+Date.now().toString(36)+"-"+(++k);
  D.rels.chains.push({id:id,name:name,parent:par,members:all});
  return id;
}
// 拖两条认知相叠 → 选关系 → 取名 → 生成演化链。交互和已验收的 HTML 一致。
let dragId=null,suppressClick=false;
function bindCog(){
  const host=document.querySelector(".cog");if(!host)return;
  const tree=host.querySelector("#tree");
  if(tree){
    // 用指针事件自己做拖拽，不用 HTML5 的 drag-and-drop。
    // 原因：整行就是一个 <button>，浏览器在按钮上按下时走按钮自己的行为，
    // 根本不会启动 HTML5 拖拽；而且 Safari/Firefox 没有 setData 就直接放弃。
    // 指针事件鼠标和手指走同一套，手机上也能拖。
    let drag=null;                       // {id, el, x, y, on} 按下之后的状态
    const HOLD=320, MOVE=8;              // 手指要按住 320ms 才算拖，免得划不动页面
    const clear=()=>{tree.querySelectorAll(".dragging,.dropok")
      .forEach(n=>n.classList.remove("dragging","dropok"))};
    // 拖到屏幕边缘时自动滚动：树很长，目标经常不在同一屏，
    // 而 elementFromPoint 对视口外的点返回 null，不滚就永远够不着。
    const EDGE=90,SPEED=14;let scroller=null;
    const autoScroll=y=>{
      const h=window.innerHeight;
      const dir=y<EDGE?-1:(y>h-EDGE?1:0);
      if(!dir){if(scroller){clearInterval(scroller);scroller=null}return}
      if(scroller)return;
      scroller=setInterval(()=>{
        if(!drag||!drag.on){clearInterval(scroller);scroller=null;return}
        const box=document.scrollingElement.scrollTop?document.scrollingElement:document.body;
        box.scrollTop+=dir*SPEED;
        if(drag.y2!=null){
          tree.querySelectorAll(".dropok").forEach(n=>n.classList.remove("dropok"));
          const t=under(drag.x2,drag.y2);if(t)t.classList.add("dropok");
        }
      },16);
    };
    const stopScroll=()=>{if(scroller){clearInterval(scroller);scroller=null}};
    const under=(x,y)=>{
      const el=document.elementFromPoint(x,y);
      const it=el&&el.closest?el.closest(".item"):null;
      return it&&dropTarget(it.dataset.id)&&it.dataset.id!==drag.id?it:null;
    };
    let ghost=null;
    const showGhost=(x,y)=>{
      if(!ghost){
        ghost=document.createElement("div");ghost.className="cog-ghost";
        ghost.textContent=(drag.el.querySelector(".node-label")||drag.el).textContent.trim().slice(0,28);
        document.body.appendChild(ghost);
      }
      ghost.style.transform="translate("+(x+14)+"px,"+(y+10)+"px)";
    };
    const hideGhost=()=>{if(ghost){ghost.remove();ghost=null}};
    const begin=()=>{
      if(!drag||drag.on)return;
      drag.on=true;drag.el.classList.add("dragging");showGhost(drag.x,drag.y);
      // 进入拖动之后必须禁掉滚动：否则手指一动浏览器就当成滑页面，
      // 直接发 pointercancel 把这次拖动掐掉（手机上拖不动就是这个原因）。
      tree.classList.add("nodrag-scroll");
      try{drag.el.setPointerCapture(drag.pid)}catch(e){}
    };
    tree.addEventListener("pointerdown",e=>{
      if(e.button)return;                                  // 只认左键
      const it=e.target.closest(".item");
      if(!it||!dragTarget(it.dataset.id))return;
      if(e.target.closest(".toggle"))return;               // 展开收起不参与拖动
      drag={id:it.dataset.id,el:it,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,moved:false};
      if(e.pointerType!=="mouse")                          // 手指：按住一会儿才进入拖动
        drag.timer=setTimeout(begin,HOLD);
    });
    tree.addEventListener("pointermove",e=>{
      if(!drag||e.pointerId!==drag.pid)return;
      const far=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>MOVE;
      if(!drag.on){
        if(far&&e.pointerType==="mouse")begin();           // 鼠标：移开一点就开始
        else if(far){clearTimeout(drag.timer);drag=null;return} // 手指：还没按住就划走＝滚页面
        else return;
      }
      drag.moved=true;e.preventDefault();
      drag.x2=e.clientX;drag.y2=e.clientY;showGhost(e.clientX,e.clientY);
      autoScroll(e.clientY);
      tree.querySelectorAll(".dropok").forEach(n=>n.classList.remove("dropok"));
      const t=under(e.clientX,e.clientY);if(t)t.classList.add("dropok");
    },{passive:false});
    const finish=e=>{
      if(!drag||e.pointerId!==drag.pid)return;
      clearTimeout(drag.timer);
      const d=drag;drag=null;clear();stopScroll();hideGhost();tree.classList.remove("nodrag-scroll");
      if(!d.on||!d.moved)return;                           // 没真拖动过＝普通点击，交给原来的处理
      suppressClick=true;setTimeout(()=>suppressClick=false,50);   // 拖过就不再当成点开
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const it=el&&el.closest?el.closest(".item"):null;
      if(!it){toast("没有落在任何认知上，再拖一次，叠到另一条上面再松手");return}
      if(it.dataset.id===d.id){toast("落回了自己身上，要叠到另一条上");return}
      if(ringOf(it.dataset.id)){askMove(d.id,it.dataset.id);return}
      if(!dragTarget(it.dataset.id)){toast("这一行是结构分类，不是认知，不能合并");return}
      askDragRel(d.id,it.dataset.id);
    };
    // touch-action 在手指按下那一刻就被浏览器锁定了，之后再改没用。
    // 真正能挡住滚动的只有在 touchmove 里 preventDefault（必须 passive:false）。
    // 不这么做，手指一动浏览器就判成滑页面并发 pointercancel，拖动当场中断。
    tree.addEventListener("touchmove",e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
    // 任何原生拖拽一律不让它开始：Safari 会对按钮里的文字自己起一个拖拽，
    // 一起就发 pointercancel，把我们的拖动掐掉——用户看到「拖得动但合不了」。
    tree.addEventListener("dragstart",e=>e.preventDefault());
    tree.addEventListener("pointerup",finish);
    tree.addEventListener("pointercancel",e=>{if(drag&&e.pointerId===drag.pid){
      const was=drag.on;
      clearTimeout(drag.timer);drag=null;clear();stopScroll();hideGhost();tree.classList.remove("nodrag-scroll");
      if(was)toast("拖动被浏览器打断了，请再拖一次");}});
    // 拖完松手那一下不要再当成「点开这条认知」
    tree.addEventListener("click",e=>{if(suppressClick){e.preventDefault();e.stopPropagation();}},true);
  }
  const ct=host.querySelector("#ctitle");
  if(ct)ct.addEventListener("blur",async()=>{
    const v=ct.textContent.trim(),c=chainsOf().find(x=>x.id===S.arg);
    if(!c||!v||v===c.name)return;
    const next=JSON.parse(JSON.stringify(D.rels));
    (next.chains.find(x=>x.id===c.id)||{}).name=v;
    if(await saveRels(next,"演化链改名："+v)){toast("已写回仓库");render()}else render();
  });
  const ed=host.querySelector(".record-editor");
  if(ed){
    const id=S.arg,btn=host.querySelector(".save-record"),msg=host.querySelector(".save-note");
    const original=String(D.notes?.[id]||"");let draft=null;
    try{draft=localStorage.getItem("rl.cognote:"+id)}catch(e){}
    ed.value=draft!==null?draft:original;
    btn.disabled=ed.value===original;
    msg.textContent=draft!==null?"本机未提交草稿（不会自动上传）":"正式记录来自 RL-data";
    ed.addEventListener("input",()=>{
      btn.disabled=ed.value===String(D.notes?.[id]||"");
      try{localStorage.setItem("rl.cognote:"+id,ed.value)}catch(e){}
      msg.textContent=btn.disabled?"与仓库一致":"未提交草稿";
    });
    btn.addEventListener("click",async()=>{
      if(!realCogUid(id))return msg.textContent="不是永久认知 UID，禁止保存";
      btn.disabled=true;msg.textContent="正在写入 RL-data";
      const next=copyJSON(D.notes||{});
      if(ed.value.trim())next[id]=ed.value;else delete next[id];
      try{
        await put("cognotes.json",next,"补充认知："+id,{create:true});
        D.notes=next;try{localStorage.removeItem("rl.cognote:"+id)}catch(e){}
        msg.textContent="已写入 RL-data，其他设备和 AI 可从仓库读取";
      }catch(e){
        try{localStorage.setItem("rl.cognote:"+id,ed.value)}catch(e2){}
        btn.disabled=false;msg.textContent="保存失败，草稿仍在："+e.message;
      }
    });
  }
}

// 拖完（或点选完）只弹一个面板，一次确认：
// 选链里哪一条（如果拖到了链上）、选关系、看方向、给新链取名，全在一屏里。
// 不再用 confirm() / prompt()——有些浏览器环境会静默拦截它们，
// 结果就是「拖上去了但什么都没发生」。
function askDragRel(from,to){
  if(!dragTarget(from)||!dragTarget(to))return;
  const t=TREE||buildTree(),nm=u=>esc(t.T[u]?.name||u),dt=u=>t.T[u]?.d||"";
  const chainOf=id=>chainsOf().find(c=>c.id===id);
  const membersOf=id=>{const c=chainOf(id);return c?(c.members||[]).filter(realCogUid):[id]};
  const byDate=(x,y)=>{const a=dt(x),b2=dt(y);return a&&b2?(a<b2?-1:a>b2?1:0):a?-1:b2?1:0};
  const latest=id=>membersOf(id).slice().sort(byDate).pop();
  const st={a:latest(from),b:latest(to),rel:null,rev:false};
  const pickRow=(id,key,label)=>{const ms=membersOf(id);if(ms.length<2)return"";
    return '<div class="relq">'+label+'「'+esc(chainOf(id).name)+'」里的哪一条？</div><div class="relchips">'+
      ms.map(u=>'<button class="relchip" data-pick="'+key+'" data-u="'+esc(u)+'">'+nm(u)+'</button>').join("")+'</div>'};
  const m=cogSheet(
    '<div class="relq">把这两条连起来</div>'+
    pickRow(from,"a","拖起来的是")+pickRow(to,"b","放上去的是")+
    '<div class="relgroup"><div class="relgh">合成演化链<em>两条收进一条链，从树上原位置消失</em></div>'+
      REL6.slice(0,3).map((r,i)=>'<button class="relbtn" data-i="'+i+'">'+r[0]+'<em>'+r[1]+'</em></button>').join("")+'</div>'+
    '<div class="relgroup"><div class="relgh">只连线<em>两条都留在原位，详情页里互相能跳</em></div>'+
      REL6.slice(3).map((r,i)=>'<button class="relbtn" data-i="'+(i+3)+'">'+r[0]+'<em>'+r[1]+'</em></button>').join("")+'</div>'+
    '<div class="reldir" hidden></div>'+
    '<div class="nameask" hidden><div class="relq">这条演化链叫什么？</div><input class="chainname"></div>'+
    '<div class="relfoot"><button class="relbtn cancel">取消</button><button class="relgo" disabled>确认</button></div>',
    (ev,mm)=>{
      const pk=ev.target.closest("[data-pick]");
      if(pk){st[pk.dataset.pick]=pk.dataset.u;sync();return}
      const rb=ev.target.closest(".relbtn[data-i]");
      if(rb){st.rel=REL6[+rb.dataset.i][0];sync();return}
      if(ev.target.closest(".relswap")){st.rev=!st.rev;sync();return}
      if(ev.target.closest(".cancel")){mm.remove();return}
      if(ev.target.closest(".relgo")&&st.rel){
        const [x,y]=order();
        const name=(mm.querySelector(".chainname").value||"").trim();

        confirmRel(x,y,st.rel,{silent:true,name:name});
      }
    });
  // 方向默认按记录时间：早的在前（旧 → 新）；一键能反过来
  function order(){const p=[st.a,st.b].sort(byDate);return st.rev?[p[1],p[0]]:p}
  function needName(){
    if(!st.rel||!isEvo(st.rel))return false;
    const ca=chainOfUid(st.a),cb=chainOfUid(st.b);
    if(ca&&cb&&ca.id===cb.id)return false;                 // 同一条链里补关系，不建新链
    return cogProject(st.a)===cogProject(st.b)&&!(ca&&cb);  // 跨项目、两条不同链都不自动合并
  }
  function sync(){
    m.querySelectorAll("[data-pick]").forEach(b2=>b2.classList.toggle("on",st[b2.dataset.pick]===b2.dataset.u));
    m.querySelectorAll(".relbtn[data-i]").forEach(b2=>b2.classList.toggle("on",REL6[+b2.dataset.i][0]===st.rel));
    const dir=m.querySelector(".reldir"),na=m.querySelector(".nameask"),go=m.querySelector(".relgo");
    if(!st.rel){dir.hidden=true;na.hidden=true;go.disabled=true;return}
    const [x,y]=order();
    dir.hidden=false;
    dir.innerHTML='<div class="relq">方向</div><div class="relarrow2"><b>'+nm(x)+'</b><span>'+
      (st.rel==="关联"?"↔":"→ "+esc(st.rel)+" →")+'</span><b>'+nm(y)+'</b></div>'+
      (st.rel==="关联"?"":'<button class="relswap">⇄ 反过来</button>');
    const need=needName();na.hidden=!need;
    if(need){const inp=m.querySelector(".chainname");
      if(!inp.value){const c=chainOfUid(st.a)||chainOfUid(st.b);inp.value=c?c.name:""}}
    go.disabled=false;
    go.textContent=isEvo(st.rel)&&need?"合成演化链":"确认";
  }
  sync();
}

async function confirmRel(from,to,rel,opts){

  }

  const cf=chainOfUid(from),ct=chainOfUid(to),cross=cf&&ct&&cf.id!==ct.id,
    crossProject=cogProject(from)!==cogProject(to);
  if(!opts.silent&&!confirm(an+"\n  └ "+rel+(rel==="关联"?" ↔ ":" → ")+bn+
    ((cross||crossProject)&&isEvo(rel)?"\n不同演化链或项目仍保持原有归属，不会自动合并。":"")+
    "\n\n"+(rel==="关联"?"确认保存这条无向关联吗？":"确认保存这个方向的关系吗？")))return false;
  let next=copyJSON(D.rels),newChain=null;next.chains=next.chains||[];next.rels=next.rels||[];
  const hit=next.rels.find(r=>r.rel===rel&&((r.from===from&&r.to===to)||
    (rel==="关联"&&r.from===to&&r.to===from)));
  if(hit?.state==="已确认")return true;
  if(isEvo(rel)&&!cross&&!crossProject&&!(cf&&ct&&cf.id===ct.id)){
    const nm=(opts.name!=null?String(opts.name):(prompt("这条演化链叫什么？\n\n"+an+"\n  └ "+rel+"\n"+bn,cf?.name||ct?.name||"")||"")).trim()
      ||cf?.name||ct?.name||(an.slice(0,12)+" → "+bn.slice(0,12));
    const keep=D.rels;D.rels=next;
    try{newChain=mergeChain(from,to,nm)}finally{next=D.rels;D.rels=keep}
  }
  if(hit){hit.state="已确认";hit.at=new Date().toISOString().slice(0,10)}
  else next.rels.push({from,to,rel,dir:rel==="关联"?"无方向":RELD[rel],why:"在认知树上选择端点后确认",
    src:"手动确认（"+new Date().toISOString().slice(0,10)+"）",state:"已确认",
    at:new Date().toISOString().slice(0,10)});

  // 保存失败就把动画撤掉，节点原样弹回来。
  const el=u=>{try{return document.querySelector('.cog .item[data-id="'+CSS.escape(u)+'"]')}catch(e){return null}};
  const sinking=(newChain&&typeof document!=="undefined")?[from,to].map(el).filter(Boolean):[];
  sinking.forEach(el=>el.classList.add("merging"));
  if(sinking.length)await new Promise(r=>setTimeout(r,430));
  const saved=await saveRels(next,"确认关系："+from+" "+rel+" "+to);
  if(!saved){sinking.forEach(el=>el.classList.remove("merging"));render();return false}
  toast("已写回仓库");
  render();
  if(newChain){
    const seg=(findChainPath(newChain)||"").split("/");
    for(let i=1;i<seg.length;i++)(S.topen=S.topen||{})[seg.slice(0,i).join("/")]=1;
    render();
    const n=el(newChain);
    if(n){n.classList.add("merged");n.scrollIntoView({block:"center",behavior:"smooth"});
      setTimeout(()=>n.classList.remove("merged"),600)}

}
function findChainPath(id){
  const t=buildTree();let hit=null;
  (function w(ids,pre,anc){for(const x of ids){if(hit||anc.includes(x))continue;
    const key=pre?pre+"/"+x:x;if(x===id){hit=key;return}
    w((t.T[x]||{}).children||[],key,anc.concat([x]))}})(t.roots,"",[]);
  return hit;
}

async function doMove(src,ringTree){
  const r=ringOf(ringTree);if(!r)return false;
  const chain=chainsOf().find(c=>c.id===src);
  const el=u=>{try{return document.querySelector('.cog .item[data-id="'+CSS.escape(u)+'"]')}catch(e){return null}};
  const leaving=typeof document!=="undefined"?el(src):null;
  if(leaving)leaving.classList.add("merging");
  if(leaving)await new Promise(res=>setTimeout(res,330));
  let ok=false;
  if(chain){
    const next=copyJSON(D.rels);
    next.chains.find(c=>c.id===src).parent=ringTree;
    ok=await saveRels(next,"移动演化链："+chain.name+" → "+r.name);
  }else{
    const before=D.cogtree,next=copyJSON(D.cogtree||{});
    next.up=next.up||{};next.up[src]=r.ringId;
    D.cogtree=next;treeDirty();
    try{await put("cogtree.json",next,"移动认知："+src+" → "+r.name);ok=true}
    catch(e){D.cogtree=before;treeDirty();toast("没能写回仓库，这次移动没算数："+e.message)}
  }
  if(!ok){if(leaving)leaving.classList.remove("merging");render();return false}
  toast("已移到「"+r.name+"」");
  const p=findChainPath(src);
  if(p){const seg=p.split("/");for(let i=1;i<seg.length;i++)(S.topen=S.topen||{})[seg.slice(0,i).join("/")]=1}
  render();
  const n=el(src);
  if(n){n.classList.add("merged");n.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(()=>n.classList.remove("merged"),600)}
  return true;
}

async function reanalyze(id){
  const P=D.p[id],row=P&&focusRowOf(P);
  if(!row?.uid){toast("当前研究焦点 UID 无效，请重新选择；没有重新排队");return false}
  // 只更新已经确认的研究对象的分析状态，不按优先级重新挑选认知。
  const next=copyJSON(P.current);
  if(!next.focus?.focusUid)next.focus={...(next.focus||{}),focusUid:row.uid};
  next.night={status:"wait",deadline:next8(),retries:0,error:null,
              requestedAt:new Date().toISOString(),requestedBy:"在网页上点了重新分析"};
  if(id===cur()){
    next.focus.syncPending=true;
    next.focus.syncLocal=true;
  }
  try{
    await put(`projects/${id}/current.json`,next,"标为待分析（用户点了重新分析）");

}

let K=1,ZOOM=1;
function fitBoard(){
  const b=document.getElementById("board"),c=document.getElementById("cvs");if(!b||!c) return;
  const pj=D.p[S.arg||cur()]?.project,ns=pj?.sop?.nodes||[];if(!ns.length) return;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  ns.forEach(n=>{const el=document.querySelector(`.nd[data-nid="${n.id}"]`);
    const w=el?el.offsetWidth:150,h=el?el.offsetHeight:56;
    mnX=Math.min(mnX,n.x||0);mnY=Math.min(mnY,n.y||0);mxX=Math.max(mxX,(n.x||0)+w);mxY=Math.max(mxY,(n.y||0)+h)});
  const pad=16,W=mxX-mnX+pad*2,H=mxY-mnY+pad*2,cw=b.clientWidth||600;
  // 原来只按宽度缩放、高度被 62vh 一刀切，长链（量化 SOP 有 11 个节点排成一竖列）
  // 会被从下面剪掉。改成宽高同时满足，框子本身也放到 82vh，尽量把整张图放进来。
  const maxH=Math.max(360,Math.round(window.innerHeight*0.82));
  K=Math.min(cw/W,maxH/H,1)*ZOOM;
  // 宽屏下整张图比框子窄（量化 SOP 只占 712px），不居中的话图全挤在左边、右边一大片空
  const ox=ZOOM>1?0:Math.max(0,(cw-W*K)/2);
  c.style.transform=`translate(${(-mnX+pad)*K+ox}px,${(-mnY+pad)*K}px) scale(${K})`;
  b.style.height=Math.round(Math.min(H*K+2,maxH))+"px";
  b.classList.toggle("zoom",ZOOM>1);
  const z=document.getElementById("zl");if(z)z.textContent=Math.round(K*100)+"%";
}

function nodesOf(){const id=S.arg||cur();return curSop(D.p[id]?.project)||{}}
function anchorPt(a,b,ea,eb){
  const aw=ea.offsetWidth,ah=ea.offsetHeight,bw=eb.offsetWidth,bh=eb.offsetHeight;
  const ax=(a.x||0)+aw/2,ay=(a.y||0)+ah/2,bx=(b.x||0)+bw/2,by=(b.y||0)+bh/2,dx=bx-ax,dy=by-ay;
  if(!dx&&!dy) return [ax,ay];
  const sx=dx?(aw/2+4)/Math.abs(dx):1e9, sy=dy?(ah/2+4)/Math.abs(dy):1e9, s=Math.min(sx,sy);
  return [ax+dx*s,ay+dy*s];
}
function drawEdges(){
  const g=document.getElementById("eg");if(!g) return;
  const sop=nodesOf(),ns=sop.nodes||[];g.innerHTML="";
  (sop.edges||[]).forEach(([f,t])=>{
    const a=ns.find(n=>n.id===f),b=ns.find(n=>n.id===t);if(!a||!b) return;
    const ea=document.querySelector(`.nd[data-nid="${f}"]`),eb=document.querySelector(`.nd[data-nid="${t}"]`);
    if(!ea||!eb) return;
    const p1=anchorPt(a,b,ea,eb),p2=anchorPt(b,a,eb,ea);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`);
    p.setAttribute("stroke",getComputedStyle(document.documentElement).getPropertyValue("--edge").trim()||"#8A7B58");p.setAttribute("stroke-width","1.5");
    p.setAttribute("fill","none");p.setAttribute("marker-end","url(#ah)");
    g.appendChild(p);
  });
}

  }
  if(d.rawmode){
    const sep=d.rawmode.indexOf("|"),i=+d.rawmode.slice(0,sep),k=d.rawmode.slice(sep+1);
    const id=projId(),row=D.p[id]?.rows[i];if(!row)return;
    const ed=t.closest(".kv").querySelector("textarea[data-rk]");
    row.fieldModes=row.fieldModes||{};
    row.fieldModes[k]=fieldMode(row,k,ed.value)==="code"?"text":"code";
    return saveRows(id,"切换文本显示模式");
  }
  if(d.addchild)return addCogChild(d.addchild);
  if("addrow" in d){
    const id=projId(),P=D.p[id],c={};(P.project.columns||[]).forEach(k=>c[k]="");
    const date=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
    P.rows.push({date,f:"待改",q:"",cols:c,night:null});
    const i=P.rows.length-1;
    try{await put(`projects/${id}/rows.json`,P.rows,"新增记录");}
    catch(err){P.rows.pop();return toast("新增失败："+err.message)}
    return go("row",date+"|"+i+"|"+id);
  }
  if(d.coledit!=null){S.colEdit=+d.coledit;return render()}
  if(d.colcancel){S.colEdit=null;return render()}
  if(d.coldel!=null){
    const box=t.closest(".row");const inp=box&&box.querySelector("[data-colname]");
    const id=projId(),P=D.p[id],row=P&&P.rows[S.colEdit];
    if(row&&String(row.cols?.[d.coldel]??"").trim())return toast("「"+d.coldel+"」这一栏有内容，先把内容清空再删");
    if(box)box.remove();return;
  }
  if(d.colsave!=null){
    const i=+d.colsave,id=projId(),P=D.p[id],row=P&&P.rows[i];if(!row)return;
    const before=copyJSON(row);
    const inputs=[...document.querySelectorAll("#coledit [data-colname]")];
    const next=[],moves=[];
    for(const el of inputs){
      const nv=el.value.trim(),old=el.dataset.old||"";
      if(!nv){if(old&&String(row.cols?.[old]??"").trim())return toast("「"+old+"」有内容，不能把名字清空");continue}
      if(nv===PRI)continue;
      if(next.includes(nv))return toast("栏目「"+nv+"」重复了");
      next.push(nv);if(old&&old!==nv)moves.push([old,nv]);
    }
    if(!next.length)return toast("至少留一栏");
    // 被删掉的旧栏目必须是空的（✕ 已经拦过一次，这里再兜一次底）
    const kept=new Set(inputs.map(el=>el.dataset.old).filter(Boolean));
    const dropped=rowColumns(P.project,row).filter(c=>!kept.has(c));
    const lost=dropped.find(c=>String(row.cols?.[c]??"").trim());
    if(lost)return toast("「"+lost+"」有内容，不能删");
    row.cols=row.cols||{};
    for(const [o,n] of moves){
      if(String(row.cols[n]??"").trim()&&!moves.some(m=>m[0]===n))return toast("已经有一栏叫「"+n+"」并且有内容，换个名字");
    }
    const snap={...row.cols};
    const modes={...(row.fieldModes||{})};
    for(const [o] of moves)delete row.cols[o];
    for(const [o,n] of moves)row.cols[n]=snap[o];
    for(const c of dropped)delete row.cols[c];
    if(row.fieldModes){for(const [o] of moves)delete row.fieldModes[o];for(const [o,n] of moves)if(modes[o])row.fieldModes[n]=modes[o];for(const c of dropped)delete row.fieldModes[c]}
    row.columns=next.concat((before.columns||P.project.columns||[]).includes(PRI)?[PRI]:[]);
    S.colEdit=null;
    if(!(await saveRows(id,"改栏目："+next.join("／")))){P.rows[i]=before;render()}
    return;
  }
  if(d.rpick){S.relPick=S.relPick===null?"":null;return render()}
  if(d.ttoggle){S.topen=S.topen||{};S.topen[d.ttoggle]?delete S.topen[d.ttoggle]:S.topen[d.ttoggle]=1;return render()}
  if(d.tcollapse){S.topen={};return render()}
  if(d.tfocus){S.topen={};openPath().forEach(k=>S.topen[k]=1);render();
    setTimeout(()=>{const t=TREE||buildTree(),id=t.inChain[curUid()]||curUid();
      Array.from(document.querySelectorAll("#tree .item.current")).find(el=>el.dataset.id===id)?.scrollIntoView({block:"center",behavior:"smooth"});},30);return}
  if(d.chaingo||d.cogjump){
    const u=d.chaingo||d.cogjump,n=(TREE||buildTree()).T[u];
    if(!n)return;
    if(n.go)return go(n.go,n.arg);
    return go("cog",u);
  }
  if(d.topen){
    const id=d.topen.split("/").pop(),n=(TREE||buildTree()).T[id];if(!n)return;
    // 触摸屏无 HTML5 拖放也可点选两端。结构节点不参与。
    if(S.relPick!==null){
      if(!S.relPick){
        if(!dragTarget(id))return toast("请先点选一条认知或演化链");
        S.relPick=id;toast("再点一条认知（合并或连线），或点一个 SOP 节点（移到那里）");return}
      if(!dropTarget(id))return toast("请点选认知、演化链或 SOP 节点");
      const first=S.relPick;S.relPick=null;render();
      if(first!==id)return ringOf(id)?askMove(first,id):askDragRel(first,id);
      return;
    }
    if(n.chain)return go("chain",id);
    if(n.go)return go(n.go,n.arg);
    return go("cog",id);
  }
  if(d.relok!==undefined){
    const r=relsOf()[+d.relok];if(!r||r.state==="已确认")return;
    // 候选列表与拖动走完全相同的端点、方向、演化环和链合并安全校验。
    return confirmRel(r.from,r.to,r.rel);
  }
  if(d.go){if((d.go==="project"||d.go==="iter")&&!d.arg){go(d.go,cur())}else go(d.go,d.arg);return}
  if("back" in d) return back();
  if(d.tab) return tab(d.tab);
  if("sheet" in d){S.sheet=true;return render()}
  if("closesheet" in d){S.sheet=false;return render()}
  if(d.pick) return pick(d.pick);
  if(d.open){try{await loadProject(d.open)}catch(err){return toast(err.message)}return go(d.target,d.open)}
  if(d.toggle){S.open[d.toggle]=!S.open[d.toggle];return render()}
  if("edit" in d){S.edit=true;if(S.screen==="method")S.methodCat=findM(S.arg)?.cat;return render()}
  if("canceledit" in d){
    if(S.screen==="method")return cancelMethodEdit();
    if(S.screen==="res"){const [cp,cn,ci]=String(S.arg).split("|"),cnd=findNode(D.p[cp]?.project,cn);
      const cr=((cnd&&cnd.res)||[])[+ci];
      if(cr&&cr._new){cnd.res.splice(+ci,1);S.edit=false;return back()}}
    S.edit=false;return render()}
  if(d.addres){const [ap,an]=d.addres.split("|");return addRes(ap,an)}
  if(d.saveres){const [sp,sn,si]=d.saveres.split("|");return saveRes(sp,sn,+si)}
  if(d.savenode){const [pid,nid]=d.savenode.split("|");return saveNode(pid,nid)}
  if("saveboard" in d) return saveProject(S.arg||cur(),"调整 SOP 图的节点位置");
  if(d.decide){const [id,i,o]=d.decide.split("|");return decide(id,+i,o)}
  if("savecfg" in d){cfg.owner=$("#owner").value.trim();cfg.repo=$("#repo").value.trim();cfg.branch=$("#dbranch").value.trim();cfg.token=$("#token").value.trim();branchOK=null;checkedSource=null;
    for(const bag of [SHA,BASE,READ])Object.keys(bag).forEach(k=>delete bag[k]);
    cacheSource=null;D.p={};D.global=null;D.index=[];D.meth=null;D.rels=null;D.cogtree=null;D.hist=[];D.notes=null;S.topen=null;treeDirty();
    saveCfg();S.screen="today";return loadAll()}
  if("reload" in d){D.p={};return loadAll()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".tap")) e.target.click()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cfg.token){D.p={};loadAll()}});
render(); if(cfg.token) loadAll();
</script>
</body>
</html>
