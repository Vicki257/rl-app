#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}#gl:active{cursor:grabbing}
#glow{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
#vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(8,13,20,.67),transparent 27%,transparent 72%,rgba(9,14,22,.25)),radial-gradient(ellipse 70% 75% at 50% 47%,transparent 58%,rgba(5,9,15,.57) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}.world-label{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;white-space:nowrap;color:#f5f8ff;background:rgba(14,21,33,.83);border:1px solid rgba(231,244,255,.29);padding:9px 13px;border-radius:11px;box-shadow:0 6px 24px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(14px);display:flex;gap:9px;align-items:center;transition:opacity .3s,border-color .2s,background .2s}.world-label:hover,.world-label.active{border-color:var(--aqua);background:rgba(21,39,49,.92)}.world-label .bullet{display:block;height:8px;width:8px;border-radius:50%;box-shadow:0 0 14px currentColor}.world-label strong{font-weight:600;font-size:13px;letter-spacing:.02em}.world-label em{font-style:normal;font-size:10px;color:#adbdce;margin-left:3px}.world-label .stem{position:absolute;top:100%;left:50%;width:1px;height:23px;background:linear-gradient(rgba(230,242,251,.5),transparent);pointer-events:none}.world-label.rootlabel{background:rgba(35,31,34,.85);border-color:rgba(255,220,160,.55);padding:11px 16px}.world-label.rootlabel strong{font-size:14px}.world-label.ghost{opacity:0;pointer-events:none}
.nav{position:fixed;top:0;left:0;right:0;z-index:15;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 29px;background:linear-gradient(180deg,rgba(5,10,16,.83),rgba(5,10,16,.18));gap:18px}.branding{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{width:35px;height:35px;border:1px solid rgba(217,235,239,.28);border-radius:11px;display:grid;place-items:center;color:#cfe8e8;background:linear-gradient(135deg,rgba(147,234,224,.16),rgba(45,70,85,.12))}.mark svg{width:21px}.brandtitle{font-size:17px;font-weight:650;letter-spacing:.13em}.brandsub{color:#adbbc5;font-size:10px;letter-spacing:.1em;margin-top:2px}.navright{display:flex;align-items:center;gap:7px}.nav button{border:1px solid var(--border);color:rgba(235,243,249,.9);background:rgba(13,24,33,.6);padding:10px 13px;border-radius:12px;backdrop-filter:blur(15px);transition:background .2s,border .2s;white-space:nowrap}.nav button:hover{border-color:rgba(154,218,215,.5)}.nav button.selected{background:rgba(140,219,210,.19);border-color:rgba(140,219,210,.6);color:#bdfff3}.nav button.action{background:rgba(227,189,135,.16);border-color:rgba(241,203,151,.5);color:#f3d7b0}.nav .hint{color:#c0c9d4;font-size:11px;margin-right:8px;white-space:nowrap}.kbd{font-size:10px;color:rgba(211,224,232,.65);border:1px solid rgba(220,235,242,.2);padding:1px 5px;border-radius:4px;margin-left:5px}
#overview{position:fixed;z-index:12;top:99px;left:28px;width:270px;max-height:calc(100vh - 220px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:0 23px 65px rgba(0,0,0,.25);backdrop-filter:blur(28px);padding:22px 19px 16px;scrollbar-width:thin;transition:transform .3s,opacity .3s}#overview.hidden{transform:translateX(calc(-100% - 32px));opacity:0;pointer-events:none}.eyebrow{text-transform:uppercase;letter-spacing:.23em;font-size:10px;color:#aac3cb;font-weight:650}.goal{font-size:22px;font-weight:600;line-height:1.46;letter-spacing:.02em;margin:9px 0 8px}.intro{font-size:12px;color:#a4b4c4;line-height:1.8}.sep{height:1px;background:var(--line);margin:17px 0}.countrow{display:flex;align-items:end;justify-content:space-between;margin-bottom:8px}.countrow b{font-size:15px;font-weight:600}.countrow span{font-size:11px;color:var(--muted)}.district-row{width:100%;border:1px solid transparent;border-radius:11px;background:transparent;color:#d7e3ed;text-align:left;padding:10px 9px;display:flex;align-items:center;gap:11px;transition:background .2s,border .2s}.district-row:hover,.district-row.active{background:rgba(154,213,215,.09);border-color:rgba(151,218,218,.21)}.district-row .i{height:28px;width:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;background:rgba(211,236,240,.08);font-size:13px}.district-row .name{font-weight:600;font-size:12.5px}.district-row .status{font-size:10px;color:#93a8b9;display:block;margin-top:2px}.district-row .arrow{margin-left:auto;color:#8ba8b3}.focus{margin-top:14px;border:1px solid rgba(230,194,146,.29);border-radius:13px;background:linear-gradient(135deg,rgba(210,160,114,.12),transparent);padding:12px 13px}.focus .small{font-size:10px;color:#dac2a6;letter-spacing:.07em}.focus p{margin:7px 0 0;line-height:1.6;font-size:12.5px;color:#f0e4d2}.asidefoot{display:flex;justify-content:space-between;color:#7f96a6;font-size:10px;margin-top:16px}

<script>
'use strict';
/* 境界 · 认知世界：真实数据层 / 认知关系层 / 可视化世界三层分离。WebGL 渲染沿用原 3D 城市原型。 */
const canvas=document.getElementById('gl'), nativeGL=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:false,depth:true});
const gl=nativeGL || new Proxy({getShaderParameter:()=>true,getProgramParameter:()=>true,getAttribLocation:()=>0,createShader:()=>({}),createProgram:()=>({}),createBuffer:()=>({}),getUniformLocation:()=>null},{get:(obj,key)=>key in obj?obj[key]:()=>null});
const glow=document.getElementById('glow'),ctx=glow.getContext('2d');
// 加载期就被 resize() 读到，所以提前声明
var worldMode='orbit',overviewShown=innerWidth>720,buildStart=performance.now(),changing=0;
/* ============================================================
   第一层：真实数据层（无损导入）
   原始 JSON 全文保存在 RAW.files，任何界面都能回到原文。
   ============================================================ */
const RAW={files:{},meta:{},source:''};
const GH='https://raw.githubusercontent.com/Vicki257/rl-data/main/data/';
const TOPLEVEL=['global.json','widget.json','status.json','history.json','methods.json','bottleneck.json','projects/index.json'];
const PERPROJ=['project.json','rows.json','current.json','iteration.json'];

async function fetchJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+u);return r.json()}

// 项目从 projects/index.json 发现，不写死五个项目
async function loadLive(){
  const files={};
  for(const f of TOPLEVEL){try{files[f]=await fetchJSON(GH+f)}catch(e){if(f==='projects/index.json')throw e}}
  const idx=files['projects/index.json']||[];
  for(const p of idx){for(const f of PERPROJ){
    const rel='projects/'+p.id+'/'+f;
    try{files[rel]=await fetchJSON(GH+rel)}catch(e){/* 该项目没有这个文件：记录缺失，不编造 */}
  }}
  RAW.files=files;RAW.meta={source:'live',generatedAt:new Date().toISOString(),fileCount:Object.keys(files).length};RAW.source='GitHub 实时读取（只读）';
}
async function loadSnapshot(){
  const s=await fetchJSON('snapshot.json');
  RAW.files=s.files;RAW.meta=s.meta;RAW.source='本地快照 snapshot.json（commit '+String(s.meta.commit||'?').slice(0,7)+'）';
}
async function loadRaw(){
  const pref=localStorage.getItem('rlworld.source')||'snapshot';
  const order=pref==='live'?[loadLive,loadSnapshot]:[loadSnapshot,loadLive];
  let err=null;
  for(const fn of order){try{await fn();return}catch(e){err=e}}
  throw err||new Error('没有可用数据源');
}

/* ---------- 稳定标识：日期不唯一、下标会变，所以用 来源+日期+内容指纹 ---------- */
function h8(s){let h=0x811c9dc5;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return('0000000'+h.toString(16)).slice(-8)}
function rid(kind,proj,date,text){return kind+':'+proj+':'+(date||'nodate')+':'+h8(text)}

/* ---------- 导入：每个项目按自己实际存在的字段读，不假设字段一致 ---------- */
const IMP={projects:[],recs:{},byProj:{},issues:{dup:[],unmatched:[],missing:[],lag:[]},order:[]};

function put(rec){
  if(IMP.recs[rec.id]){
    const old=IMP.recs[rec.id];
    const same=JSON.stringify(old.raw)===JSON.stringify(rec.raw);
    IMP.issues.dup.push({id:rec.id,same,a:old.src,b:rec.src});
    if(same)return old;                 // 重复导入不重复建节点
    rec.id=rec.id+'~'+h8(JSON.stringify(rec.raw)); // 同指纹不同内容：另立一条，不合并
  }
  IMP.recs[rec.id]=rec;IMP.order.push(rec.id);
  (IMP.byProj[rec.proj]=IMP.byProj[rec.proj]||[]).push(rec.id);
  return rec;
}
const F=p=>RAW.files[p];

function runImport(){
  IMP.projects=[];IMP.recs={};IMP.byProj={};IMP.order=[];IMP.issues={dup:[],unmatched:[],missing:[],lag:[]};
  const index=F('projects/index.json')||[];
  for(const meta of index){
    const id=meta.id, P=F('projects/'+id+'/project.json');
    if(!P){IMP.issues.missing.push('projects/'+id+'/project.json');continue}
    const rows=F('projects/'+id+'/rows.json')||[], cur=F('projects/'+id+'/current.json')||null, it=F('projects/'+id+'/iteration.json')||null;
    if(!F('projects/'+id+'/rows.json'))IMP.issues.missing.push('projects/'+id+'/rows.json');
    // 每个项目自己的完成判据与证据口径
    const done=Array.isArray(P.done)?P.done:[], states=Array.isArray(P.states)?P.states:[];
    const hasEv=rows.some(r=>typeof r.ev==='number');
    const proj={id,name:meta.name||P.name||id,state:meta.state,goal:P.goal||'',reward:P.reward||'',reality:P.reality||'',
      mainline:P.mainline||null,doing:P.doing||null,insights:P.insights||[],columns:P.columns||[],labels:P.labels||{},
      done,states,hasEv,evScale:hasEv?'本项目 rows[].ev 存在（0–5 口径仅在定义过的项目内使用）':'本项目没有 ev 字段，不套用其他项目的证据等级',

/* ============================================================
   召回与接入卡（离线启发式，不是真实 AI）
   ============================================================ */
const STOP=/[的了是在和与及对把为把被就都也很还又更要会能可不没有一个这那什么怎么如何以及从到向]/g;
function toks(s){s=String(s||'').toLowerCase().replace(/\s+/g,'');const out=new Set();
  const clean=s.replace(STOP,'');
  for(let i=0;i<clean.length-1;i++){const b=clean.slice(i,i+2);if(/[一-龥]{2}/.test(b))out.add(b)}
  for(const w of s.match(/[a-z0-9][a-z0-9\-\.]{1,}/g)||[])out.add(w);
  return out}
function overlap(a,b){let n=0;for(const t of a)if(b.has(t))n++;return n}

// 词权重：全语料里越常见的词越不值钱（IDF），避免「真正/打开/问题」这类词把无关记录顶上来
let DF=null,NDOC=0;
function buildDF(){
  DF=Object.create(null);NDOC=0;
  for(const r of recs()){
    if(!['row','layer','case','method','hist','main','chain'].includes(r.kind))continue;
    NDOC++;const seen=hayOf(r);
    for(const t of seen)DF[t]=(DF[t]||0)+1;
  }
}
function hayOf(r){
  if(r._hay)return r._hay;
  const title=r.title+' '+(r.q||'');
  const body=JSON.stringify(r.cols||'')+' '+(r.kind==='method'?JSON.stringify(r.raw):'')+' '+(r.kind==='case'?(r.raw.why||'')+(r.raw.sum||''):'');
  const H=toks(title),B=toks(body);
  r._hayTitle=H;r._hay=new Set([...H,...B]);return r._hay;
}
function idf(t){return Math.log((NDOC+1)/((DF&&DF[t]||0)+1))}
// 打分：标题命中 > 正文命中，罕见词权重高。只做召回，不下结论。
function recall(text,limit){
  if(!DF)buildDF();
  const T=toks(text),today='2026-11-09';
  const cands=[];
  for(const r of recs()){
    if(!['row','layer','case','method','hist','main','chain'].includes(r.kind))continue;
    const hay=hayOf(r),ht=r._hayTitle;
    let w=0,hit=0,words=[],mx=0;
    for(const t of T){
      if(!hay.has(t))continue;
      hit++;words.push(t);
      const rare=idf(t);                       // 常见词接近 0，罕见词 4~6
      if(rare>mx)mx=rare;
      w+=rare*(ht.has(t)?2.2:1)*(/^[a-z0-9]/.test(t)?1.8:1);   // 标题命中、英文/代号命中更重
    }
    // 只靠「真正 / 打开 / 产品」这类常见词凑出来的命中，一律丢掉：宁可召不回，也不给错关联
    if(w<2.5||!(mx>=3.8||hit>=5))continue;
    let s=w*4;
    if(r.kind==='row'&&r.open)s+=12; if(r.kind==='row'&&!r.open)s-=8;
    if(r.kind==='layer')s+=6;
    const P=IMP.projects.find(p=>p.id===r.proj);
    const f=P&&P.current&&P.current.focus;
    if(f&&r.date===f.date&&r.title===f.q)s+=10;
    if(r.date)s+=Math.max(0,6-Math.round((Date.parse(today)-Date.parse(r.date))/(86400000*30)));
    s=Math.round(s);
    cands.push({r,score:s,hit,words,conf:s>=120?'高':s>=60?'中':'低'});
  }
  return cands.sort((a,b)=>b.score-a.score).slice(0,limit||6);
}
function guessRel(text){
  const t=String(text);
  if(/没想到|反而|居然|竟然|矛盾|其实不是|不对|怀疑/.test(t))return 'challenge';

// 视觉标记（只是表现，不作为数据判据）
function drawMarkers(now){
  for(const d of districts){
    const s=d.st,p=projPoint([d.xyz[0],d.height+3,d.xyz[2]],viewProj,W,H);
    if(!p||p.x<-60||p.x>W+60)continue;
    // 探索：临时光点，不加建筑
    for(let k=0;k<Math.min(12,s.pending);k++){const a=k*2.399+now*.0004,r=22+((k*7)%18);
      ctx.fillStyle='rgba(141,228,220,'+(.35+.25*Math.sin(now*.003+k)).toFixed(3)+')';
      ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r*.55,1.8,0,7);ctx.fill()}
    // 待完成的必要子问题：虚线脚手架
    if(s.sub){ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(226,191,140,.45)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,p.y+6,16+s.sub*2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
    // 待分类探索：灰色虚点，表示还没有父节点
    if(s.orphan){ctx.fillStyle='rgba(167,178,194,.5)';for(let k=0;k<Math.min(10,s.orphan);k++){
      ctx.beginPath();ctx.arc(p.x-26+k*6,p.y+24,1.4,0,7);ctx.fill()}}
    // 现实验证过：稳定信标
    if(s.verified){ctx.fillStyle='rgba(155,208,184,.85)';ctx.beginPath();ctx.arc(p.x,p.y-12,3.2,0,7);ctx.fill()}
  }
}

const pname=id=>(IMP.projects.find(p=>p.id===id)||{name:id}).name;
// 优先级建议：可解释、可反驳，不是 AI 评出的进步百分比
function suggest(){
  let best=null;
  for(const r of recs()){
    if(r.kind!=='row'||!visible(r)||!openAt(r))continue;
    if(/作废|误录/.test(r.title))continue;
    const P=IMP.projects.find(p=>p.id===r.proj)||{};
    const f=P.current&&P.current.focus;
    const why=[];let s=0;
    const pri=parseInt((r.cols||{})['优先程度']||'',10);
    if(!isNaN(pri)){s+=pri*3;why.push('本项目自己打的优先程度 '+pri)}
    if(f&&f.date===r.date&&f.q===r.title){s+=10;why.push('它正是 '+P.name+' current.json 里的焦点')}
    const inc=edgesIn(r.id).filter(e=>edgeVisible(e));
    const pend=inc.filter(e=>e.confirm==='pending');
    if(pend.length){s+=9*pend.length;why.push(pend.length+' 条新认识指向它但还没确认关系（'+pend.map(e=>REL[e.rel]).join('、')+'）')}
    const days=Math.round((Date.parse(ASOF||'2026-11-09')-Date.parse(r.date))/86400000);
    if(days<=14){s+=6;why.push('最近 '+days+' 天的记录')}
    if(/有/.test((r.cols||{})['碰现实了吗']||'')){s+=4;why.push('已经碰过现实，继续推进有反馈可依')}
    if(!best||s>best.s)best={r,s,why:why.join('；')||'只按未完成和时间排出来的'};
  }
  return best;
}

/* 节点详情：旧问题 → 当前认识 → 新发现 → 为什么深入 → 当前未知 → 下一步 */
function openNode(id){
  const r=IMP.recs[id]||null,n=COG.nodes[id]||null;

  const title=(r&&r.title)||n.title;
  const parents=edgesIn(id).filter(edgeVisible),kids=edgesOut(id).filter(edgeVisible);

  H.push('<div class="lvl"><div class="h">① 旧问题 / 它接在哪里</div>');

    H.push('<p class="t"><span class="chip '+(confirmed(e)?'g':'r')+'">'+REL[e.rel]+' · '+(confirmed(e)?'已确认':'待确认')+'</span>'+escapeHtml(f.title||e.from)+'</p>');

  }else H.push('<p class="t pend">没有已确认的父节点。这一条停在「待分类探索」，不强行归入任何方向。</p>');
  H.push('</div>');

  H.push('<div class="lvl"><div class="h">② 当前认识（原始字段原文）</div><p class="t">'+escapeHtml(oldViewOf(r||{kind:'x',title:title}))+'</p></div>');

  const newer=parents.filter(e=>['evidence','challenge','revise','verify'].includes(e.rel));
  H.push('<div class="lvl"><div class="h">③ 新发现 / 谁在挑战它</div>');
  if(newer.length)for(const e of newer){const f=IMP.recs[e.from]||{};
    H.push('<p class="t">'+escapeHtml(f.title||e.from)+' <span class="chip">'+escapeHtml(f.date||'')+'</span><span class="chip '+(e.ev==='verified'?'g':'r')+'">证据：'+EVST[e.ev]+'</span></p>');

  if(kids.length){H.push('<div class="card2"><div class="lb">它连向哪里（出边）</div>');

function unknownOf(r,c){
  if(!r)return '—';
  const u=[];
  if(c['依据与验证状态'])u.push(c['依据与验证状态']);
  if(c['碰现实了吗']&&!/有/.test(c['碰现实了吗']))u.push('还没碰现实（本项目字段：'+c['碰现实了吗']+'）');
  if(r.open)u.push('本项目判据下状态仍是「'+(r.state||'?')+'」，不算完成。');
  if(r.kind==='layer'&&/研究中|正在研究/.test(r.title))u.push('这一层数据里自己标着仍在研究，不是已得结论。');
  return u.join('\n')||'原始记录里没有写未知部分。';
}
function nextOf(r,c){
  if(!r)return '—';
  if(c['下一步'])return c['下一步'];
  if(c['改后验证'])return '待验证：'+c['改后验证'];
  if(r.open)return '需要你决定：继续深入、补证据，还是先放着。系统不会自动把它标成已解决。';
  return '已按本项目判据收尾'+(r.closedAt?'（'+dayOf(r.closedAt)+'）':'')+'，不再作为待办。';
}

const pressed={};document.addEventListener('keydown',e=>{if(document.activeElement===document.getElementById('utterance'))return;pressed[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown'].includes(e.key.toLowerCase()))e.preventDefault()});document.addEventListener('keyup',e=>pressed[e.key.toLowerCase()]=false);setInterval(()=>{if(worldMode!=='roam')return;let speed=1.05,forward=Number(pressed.w||pressed.arrowup)-Number(pressed.s||pressed.arrowdown),side=Number(pressed.d||pressed.arrowright)-Number(pressed.a||pressed.arrowleft);if(!forward&&!side)return;roamPos[0]+=(Math.sin(roamYaw)*forward+Math.cos(roamYaw)*side)*speed;roamPos[2]+=(-Math.cos(roamYaw)*forward+Math.sin(roamYaw)*side)*speed;roamPos[0]=Math.max(-68,Math.min(68,roamPos[0]));roamPos[2]=Math.max(-75,Math.min(60,roamPos[2]))},30);
document.querySelectorAll('[data-move]').forEach(b=>{let key={forward:'w',back:'s',left:'a',right:'d'}[b.dataset.move];b.addEventListener('pointerdown',e=>{pressed[key]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>pressed[key]=false)});
/* ---------- 模式、生长动画、回放、启动 ---------- */
const elLabels=document.getElementById('labels');
// worldMode 等在 00-state.js 里提前声明（resize 在加载期就会读它）
function toggleOverview(force){overviewShown=typeof force==='boolean'?force:!overviewShown;$('#overview').classList.toggle('hidden',!overviewShown)}
function worldOverview(){worldMode='orbit';$('#orbit').classList.add('selected');$('#roam').classList.remove('selected');$('#modeHint').textContent='俯瞰全景 · 拖动旋转 · 滚轮缩放 · 点击建筑';if(innerWidth>720)toggleOverview(true);targetZoom=innerWidth<720?112:82;orbitTarget=[0,11,-15];$('#mobilemove').classList.remove('show')}
function enterRoam(){worldMode='roam';$('#roam').classList.add('selected');$('#orbit').classList.remove('selected');$('#modeHint').textContent='漫游模式 · W A S D 行走 · 拖动画面转向';roamPos=[1.8,2.6,46];roamYaw=0;roamPitch=.08;$('#mobilemove').classList.add('show')}
function focusDistrict(d){if(!d)return;orbitTarget=[d.xyz[0]*.68,10,d.xyz[2]*.68];targetZoom=innerWidth<721?101:66}
function grow(which){proposalEffect=which||active||districts[0];changing=performance.now();
  const i=districts.indexOf(proposalEffect);manualGrow={index:i<0?0:i,start:performance.now()};
  if(proposalEffect)notice('✦ 认知更新：'+proposalEffect.name+' 的结构发生变化')}
function rebuild(){buildDistricts();buildWorld();renderOverview();if(active){const a=districts.find(d=>d.id===active.id);if(a){active=a;select(a.id)}}}

/* 历史回放：按日期看过去某一天为止的认知状态 */
function replayOn(){
  const ds=DATES();if(!ds.length)return notice('没有日期可回放');
  const r=$('#rpRange');r.min=0;r.max=ds.length-1;r.value=ds.length-1;
  ASOF=null;$('#rpDate').textContent=ds[ds.length-1]+'（今天）';
  $('#replay').classList.add('show');
  r.oninput=()=>{const i=+r.value;ASOF=(i===ds.length-1)?null:ds[i];
    $('#rpDate').textContent=ds[i]+(ASOF?'':'（今天）');rebuild()};
}
function replayOff(){ASOF=null;$('#replay').classList.remove('show');rebuild();notice('回到当前状态')}

$('#toggleNav').onclick=()=>toggleOverview();
$('#orbit').onclick=worldOverview;$('#roam').onclick=enterRoam;
$('#btnCards').onclick=()=>openCards(null);
$('#btnReport').onclick=showReport;
$('#btnReplay').onclick=replayOn;$('#rpOff').onclick=replayOff;
$('#closeSheet').onclick=closeSheet;
$('#closeDet').onclick=()=>{$('#details').classList.remove('show');active=null;document.querySelectorAll('.district-row').forEach(x=>x.classList.remove('active'))};
$('#send').onclick=()=>{const t=$('#utterance').value.trim();if(!t)return notice('先写一句今天的新认识');$('#utterance').value='';openCards(t)};
$('#utterance').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
(function(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const m=$('#mic');
  if(!SR){m.disabled=true;$('#voiceNote').textContent='这台浏览器不支持语音听写；可以直接粘贴对话文本（实时语音接入是后续能力）';return}
  const sr=new SR();sr.lang='zh-CN';sr.interimResults=true;
  sr.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;$('#utterance').value=t};
  sr.onerror=()=>notice('语音听写失败，请直接粘贴文本');
  m.onclick=()=>{try{sr.start();notice('正在听写（浏览器本地能力，不是接入 AI）')}catch(err){}}})();

/* ---------- 启动 ---------- */
(async function boot(){
  try{
    await loadRaw();
    runImport();
    loadCog();
    if(!COG.seeded){seedCognition();seedCandidates();saveCog()}
    else{seedCognition();seedCandidates();saveCog()}   // 增量：已确认的边保持不变，只补新节点
    buildDistricts();buildWorld();renderOverview();toggleOverview(overviewShown);worldOverview();
    $('#brandsub').textContent='真实数据：'+recs().length+' 条记录 · '+IMP.projects.length+' 个项目';
    $('#offlineTag').textContent='数据源：'+RAW.source+' · 只读，不写回 RL-data · 召回与关系判断为离线启发式（未接入真实 AI）';
    requestAnimationFrame(render);
    setTimeout(()=>notice('已导入 '+Object.keys(RAW.files).length+' 个原始文件，'+recs().length+' 条记录'),900);

  }
})();
